  const vencidos = lotes.filter(x => x.d < 0).sort((a, b) => a.d - b.d), prox = lotes.filter(x => x.d >= 0 && x.d <= cfg.diasVence).sort((a, b) => a.d - b.d);
  const inm = inmovilizado();
  const top = P.filter(([p, i]) => i.vendMes > 0).sort((a, b) => b[1].montoMes - a[1].montoMes).slice(0, 10);
  const fila = (p, der, extra) => `<button class="fila-lista" onclick="fichaProducto('${p.id}')"><span><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod}${extra ? ' · ' + extra : ''}</span></span><span class="derecha">${der}</span></button>`;
  const tarjeta = (t, sub, n, cls, cuerpo, acc) => `<div class="card alerta-card ${cls}"><div class="card-cab"><div class="card-t">${t} <span class="card-num">${n}</span><small>${sub}</small></div>${acc || ''}</div>
    ${n ? `<div class="lista">${cuerpo}</div>` : vacio('Nada por acá.')}</div>`;
  const venceTodo = vencidos.concat(prox);
  $('#stock-cuerpo').innerHTML = `<div class="grid g-2">
    ${tarjeta('Sin stock', 'No hay para vender', falta.length, 'ac-rojo', falta.map(([p, i]) => fila(p, `<b class="neg num">${cant(i.disp)} ${unidadCorta(p)}</b>`)).join(''),
      falta.length ? `<button class="btn btn-linea btn-sm" onclick="tabStock('lista')">${ico('lista')} Pedir</button>` : '')}
    ${tarjeta('Poco stock', 'Quedan menos que el mínimo', bajo.length, 'ac-amarillo', bajo.map(([p, i]) => fila(p, `<b class="am num">${cant(i.disp)}</b> <span class="muted">de ${cant(p.min)}</span>`)).join(''))}
    ${tarjeta('Por vencer', 'Vencidos y los que vencen en ' + cfg.diasVence + ' días', venceTodo.length, 'ac-rojo', venceTodo.map(x => fila(x.p,
      `<span class="chip ${x.d < 0 ? 'c-rojo' : x.d <= 30 ? 'c-rojo' : 'c-amarillo'}">${x.d < 0 ? 'Vencido' : 'Vence ' + cuando(x.l.vence)}</span>`, cant(x.l.c) + ' ' + unidadCorta(x.p) + ' · lote ' + esc(x.l.lote))).join(''))}
    ${tarjeta('No se venden', 'Sin ventas en ' + cfg.diasSinVentas + ' días' + (dueno ? ' · plata parada: <b class="t2">' + pesos(inm.monto) + '</b>' : ''), inm.lista.length, '',
      inm.lista.sort((a, b) => stockDe(b) * b.costo - stockDe(a) * a.costo).map(p => { const i = info(p); return fila(p, dueno ? `<b class="num">${pesos(Math.max(0, i.st) * p.costo)}</b>` : `<span class="num">${cant(i.st)} ${unidadCorta(p)}</span>`, i.ult ? 'última venta ' + cuando(i.ult) : 'nunca se vendió'); }).join(''))}
  </div>
  <div class="card mt"><div class="card-cab"><div class="card-t">Lo más vendido del mes</div></div>
    <div class="chips-lista">${top.map(([p, i], k) => `<button class="chip sin-punto c-gris" onclick="fichaProducto('${p.id}')">${k + 1}. ${esc(p.nombre)}</button>`).join('') || '<span class="muted">Todavía no hay ventas este mes.</span>'}</div></div>`;
}

/* ---------- Lista de compra sugerida (por proveedor) ---------- */
function sugeridoPara(p){ const i = info(p), paso = pasoDe(p); return Math.max(paso, Math.ceil((p.min * 2 - i.disp) / paso) * paso); }
function pintarListaCompra(){
  const bajos = D().productos.filter(p => ['falta', 'bajo'].includes(info(p).estado) || info(p).disp <= p.min);
  const porProv = {}; bajos.forEach(p => (porProv[p.prov] = porProv[p.prov] || []).push(p));
  const pedidosAbiertos = D().pedidos.filter(pd => estadoPedido(pd) !== 'recibido');
  const yaPedido = pid => pedidosAbiertos.reduce((s, pd) => s + pd.it.filter(i => i.p === pid).reduce((a, i) => a + i.c - i.r, 0), 0);
  $('#stock-cuerpo').innerHTML = `<div class="caja-info">${ico('lista')}<span>Productos bajo el mínimo, agrupados por proveedor. La cantidad sugerida lleva cada producto al <b>doble del mínimo</b>; se puede cambiar antes de enviar el pedido.</span></div>
    <div class="grid g-2 mt">${Object.keys(porProv).map(pid => { const pv = proveedor(pid);
      return `<div class="card"><div class="card-cab"><div class="card-t">${esc(pv.nombre)}<small>${esc(pv.contacto)} · ${esc(pv.tel)} · entrega ${esc(pv.dias.toLowerCase())}</small></div></div>
        <table class="tabla tabla-comp"><thead><tr><th>Producto</th><th class="derecha">Disp.</th><th class="derecha">Pedir</th></tr></thead><tbody>
        ${porProv[pid].map(p => { const i = info(p), yp = yaPedido(p.id); return `<tr><td><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod} · mín. ${cant(p.min)}${yp ? ` · <b class="am">ya pedido ${cant(yp)}</b>` : ''}</span></td>
          <td class="derecha num ${i.disp <= 0 ? 'neg' : 'am'}">${cant(i.disp)}</td><td class="derecha"><input class="mini" type="number" id="lc_${p.id}" min="0" step="${pasoDe(p)}" value="${yp ? 0 : sugeridoPara(p)}"> <span class="muted">${unidadCorta(p)}</span></td></tr>`; }).join('')}
        </tbody></table>
        <div class="fila mt-s" style="justify-content:flex-end"><button class="btn btn-wa btn-sm" onclick="pedidoWhatsApp('${pid}')">${ico('wa')} Enviar por WhatsApp</button>
          <button class="btn btn-azul btn-sm" onclick="crearPedidoDesdeLista('${pid}')">${ico('compras')} Crear pedido</button></div></div>`; }).join('')}</div>
    ${bajos.length ? '' : vacio('No hay productos bajo el mínimo. ¡Todo en orden!')}`;
}
function leerListaCompra(pid){ return D().productos.filter(p => p.prov === pid).map(p => { const el = $('#lc_' + p.id); return el && Number(el.value) > 0 ? { p:p.id, c:r2(Number(el.value)) } : null; }).filter(Boolean); }
function pedidoWhatsApp(pid){
  const it = leerListaCompra(pid), pv = proveedor(pid);
  if (!it.length){ error('No hay cantidades para pedir'); return; }
  const lista = it.map(i => { const p = producto(i.p); return `• ${cant(i.c)} ${unidadCorta(p)} · ${p.nombre} (${p.cod})`; }).join('\n');
  abrirWhatsApp(pv.tel, textoMensaje(D().config.mensajes.pedido, { proveedor:primerNombre(pv.contacto), lista }));
}
function crearPedidoDesdeLista(pid){
  const it = leerListaCompra(pid);
  if (!it.length){ error('No hay cantidades para pedir'); return; }
  const pd = { id:Store.id('pd'), num:nuevoNumero('pedido'), prov:pid, f:hoy(), it:it.map(i => ({ p:i.p, c:i.c, r:0 })), nota:'Desde la lista de compra', u:usuarioTxt() };
  D().pedidos.push(pd);
  registrar(`Creó el pedido Nº ${pd.num} a ${nombreProv(pid)} (${it.length} productos)`);
  guardar(); avisar('Pedido Nº ' + pd.num + ' creado. Queda en Compras → Pedidos.', 'compras'); refrescar();
}

/* ---------- Ajuste manual (solo dueños, motivo obligatorio) ---------- */
function formAjuste(id){
  if (!esDueno()) return;
  abrirModal({ titulo:'Ajustar stock', sub:'Rotura, pérdida, uso interno o corrección. Queda registrado.', ancho:'md',
    cuerpo:`<div class="form">
      ${campo('Producto', `<input name="prod" list="dl-prod" value="${id ? esc(producto(id).cod + ' · ' + producto(id).nombre) : ''}" placeholder="Escribí el nombre o el código" oninput="infoAjuste()">
        <datalist id="dl-prod">${D().productos.map(p => `<option value="${esc(p.cod + ' · ' + p.nombre)}">`).join('')}</datalist>`, { ancho:true, req:true })}
      <div class="ancho" id="aj-info"></div>
      ${campo('Movimiento', sel('sentido', [['-', 'Sale del stock (−)'], ['+', 'Entra al stock (+)']], '-'))}
      ${campo('Cantidad', inp('cant', '', 'number', 'min="0"'), { req:true })}
      ${campo('Motivo', sel('motivo', [['', 'Elegí el motivo…']].concat(MOTIVOS_AJUSTE.map(m => [m, m])), ''), { req:true })}
      ${campo('Detalle', inp('nota', '', 'text', 'placeholder="Ej.: se rompió al descargar"'))}
    </div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="guardarAjuste()">${ico('ok')} Confirmar ajuste</button>`,
    alAbrir: () => infoAjuste() });
}
function prodDeTexto(t){ const cod = String(t || '').split(' · ')[0].trim().toLowerCase(); return D().productos.find(p => p.cod.toLowerCase() === cod || p.barras === cod); }
function infoAjuste(){
  const p = prodDeTexto($('[name=prod]').value), caja = $('#aj-info'); if (!caja) return;
  caja.innerHTML = p ? `<div class="caja-info">${ico('stock')}<span>Stock actual de <b>${esc(p.nombre)}</b>: <b>${cant(stockDe(p))} ${unidadCorta(p)}</b> · disponible ${cant(disponibleDe(p))}${p.vence ? ' · maneja lotes (sale primero el que vence antes)' : ''}</span></div>` : '';
}
function guardarAjuste(){
  const o = leerForm($('#modal-cuerpo')), p = prodDeTexto(o.prod);
  if (!p){ error('Elegí un producto de la lista'); return; }
  if (!(o.cant > 0)){ error('Indicá la cantidad'); return; }
  if (!o.motivo){ error('El motivo es obligatorio'); return; }
  const ref = o.motivo + (o.nota ? ' · ' + o.nota : '');
  if (o.sentido === '-') sacarStock(p.id, o.cant, 'ajuste', ref); else entrarStock(p.id, o.cant, 'ajuste', ref);
  registrar(`Ajustó el stock de ${p.nombre}: ${o.sentido}${cant(o.cant)} ${unidadCorta(p)} (${ref})`);
  guardar(); cerrarModal(); avisar('Ajuste registrado'); refrescar();
}

/* ---------- Inventario físico: se carga el conteo y se ven las diferencias antes de ajustar ---------- */
const EST_INV = { cat:'', conteo:{} };
function pintarInventario(){
  const cats = D().config.categorias, e = EST_INV;
  const lista = D().productos.filter(p => !e.cat || p.cat === e.cat).sort((a, b) => a.nombre.localeCompare(b.nombre));
  let difs = 0, valor = 0;
  lista.forEach(p => { const c = e.conteo[p.id]; if (c !== undefined && c !== '' && Number(c) !== stockDe(p)){ difs++; valor += (Number(c) - stockDe(p)) * p.costo; } });
  const ult = D().inventarios[D().inventarios.length - 1];
  $('#stock-cuerpo').innerHTML = `<div class="caja-info">${ico('lista')}<span>1) Elegí qué vas a contar. 2) Escribí lo que hay en el local. 3) Revisá las diferencias y confirmá: el sistema ajusta el stock. Lo que dejes vacío no se toca.
      ${ult ? `<br><small>Último inventario: ${fMedia(ult.f)} (${esc(ult.cat || 'todo')}) · ${ult.dif.length} diferencias</small>` : ''}</span></div>
    <div class="herr mt"><select class="sel" onchange="EST_INV.cat=this.value;pintarInventario()" aria-label="Categoría"><option value="">Todo el stock</option>${cats.map(c => `<option ${c === e.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <button class="btn btn-linea btn-sm" onclick="imprimirPlanillaInventario()">${ico('imprimir')} Planilla para contar</button>
      <span class="muted chico" style="margin-left:auto">${Object.keys(e.conteo).filter(k => e.conteo[k] !== '').length} contados · <b class="${difs ? 'am' : ''}">${difs} diferencias</b>${difs ? ' · ' + pesos(valor) + ' a costo' : ''}</span></div>
    <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Sistema</th><th class="derecha">Contado</th><th class="derecha">Diferencia</th></tr></thead>
      <tbody>${lista.map(p => { const c = e.conteo[p.id], s = stockDe(p), d = c === undefined || c === '' ? null : r2(Number(c) - s);
        return `<tr class="${d ? 'fila-dif' : ''}"><td><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod} · ${esc(p.cat)}</span></td><td class="derecha num">${cant(s)} ${unidadCorta(p)}</td>
          <td class="derecha"><input class="mini" type="number" step="${pasoDe(p)}" value="${c == null ? '' : c}" onchange="EST_INV.conteo['${p.id}']=this.value;pintarInventario()" aria-label="Contado"></td>
          <td class="derecha num fuerte ${d > 0 ? 'pos' : d < 0 ? 'neg' : 'muted'}">${d == null ? '—' : (d > 0 ? '+' : d < 0 ? '−' : '') + cant(Math.abs(d))}</td></tr>`; }).join('')}</tbody></table></div></div>
    <div class="fila mt" style="justify-content:flex-end"><button class="btn btn-linea" onclick="EST_INV.conteo={};pintarInventario()">Borrar conteo</button>
      <button class="btn btn-azul" ${difs ? '' : 'disabled'} onclick="confirmarInventario()">${ico('ok')} Confirmar ajuste (${difs})</button></div>`;
}
async function confirmarInventario(){
  const e = EST_INV, dif = [];
  D().productos.forEach(p => { const c = e.conteo[p.id]; if (c !== undefined && c !== '' && Number(c) !== stockDe(p)) dif.push({ p:p.id, sis:stockDe(p), real:Number(c) }); });
  if (!dif.length) return;
  if (!(await confirmar('Confirmar el inventario', `Se van a ajustar <b>${dif.length}</b> productos para que el stock quede igual a lo contado. Queda registrado como «Inventario».`, 'Ajustar stock'))) return;
  const ref = 'Inventario físico · ' + (e.cat || 'todo el stock');
  dif.forEach(x => { const d = r2(x.real - x.sis); if (d > 0) entrarStock(x.p, d, 'inventario', ref); else sacarStock(x.p, -d, 'inventario', ref); });
  D().inventarios.push({ id:Store.id('in'), f:hoy(), cat:e.cat, u:usuarioTxt(), dif });
  registrar(`Confirmó un inventario físico (${e.cat || 'todo el stock'}) con ${dif.length} diferencias`);
  EST_INV.conteo = {}; guardar(); avisar('Inventario confirmado: ' + dif.length + ' productos ajustados'); refrescar();
}

function formPreciosMasivo(){
  if (!esDueno()) return;
  abrirModal({ titulo:'Actualizar precios', sub:'Por proveedor o por categoría, en porcentaje', ancho:'md',
    cuerpo:`<div class="form">
      ${campo('Aplicar a', sel('por', [['prov', 'Un proveedor'], ['cat', 'Una categoría']], 'prov', 'onchange="formPreciosOpc()"'))}
      <div id="pm-opc">${campo('Proveedor', sel('cual', D().proveedores.map(p => [p.id, p.nombre]), '', 'onchange="previaPrecios()"'))}</div>
      ${campo('Porcentaje', inp('pct', 8, 'number', 'oninput="previaPrecios()"'), { ayuda:'Negativo para bajar (ej.: −5)' })}
      ${campo('Redondear a', sel('red', [['1', 'Sin redondeo'], ['5', '$ 5'], ['10', '$ 10']], '10', 'onchange="previaPrecios()"'))}
      ${check('costo', false, 'Actualizar también el costo (el proveedor subió la lista)', 'onchange="previaPrecios()"')}
    </div><div id="pm-previa" class="mt"></div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="aplicarPrecios()">${ico('ok')} Aplicar</button>`,
    alAbrir: () => previaPrecios() });
}
function formPreciosOpc(){
  const por = $('[name=por]').value;
  $('#pm-opc').innerHTML = por === 'prov' ? campo('Proveedor', sel('cual', D().proveedores.map(p => [p.id, p.nombre]), '', 'onchange="previaPrecios()"')) : campo('Categoría', sel('cual', D().config.categorias, '', 'onchange="previaPrecios()"'));
  previaPrecios();
}
function calculoPrecios(){
  const o = leerForm($('#modal-cuerpo')), f = 1 + (Number(o.pct) || 0) / 100, red = Number(o.red) || 1;
  const lista = D().productos.filter(p => o.por === 'prov' ? p.prov === o.cual : p.cat === o.cual);
  return { o, lista:lista.map(p => ({ p, nuevo:Math.max(1, redondear(p.precio * f, red)), costo: o.costo ? Math.round(p.costo * f) : p.costo })) };
}
function previaPrecios(){
  const { o, lista } = calculoPrecios();
  $('#pm-previa').innerHTML = `<div class="tabla-caja"><div class="tabla-scroll" style="max-height:300px"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Precio actual</th><th class="derecha">Precio nuevo</th><th class="derecha">Margen nuevo</th></tr></thead>
    <tbody>${lista.map(x => `<tr><td>${esc(x.p.nombre)}</td><td class="derecha num muted">${pesos(x.p.precio)}</td><td class="derecha num fuerte">${pesos(x.nuevo)}</td><td class="derecha num t2">${pct((x.nuevo - x.costo) / x.nuevo * 100)}</td></tr>`).join('')}</tbody></table></div></div>
    <small class="muted">${lista.length} productos · los presupuestos ya hechos mantienen su precio.</small>`;
}
async function aplicarPrecios(){
  const { o, lista } = calculoPrecios();
  if (!lista.length || !Number(o.pct)){ error('Elegí a qué aplicar y el porcentaje'); return; }
  if (!(await confirmar('Actualizar ' + lista.length + ' precios', `Se van a cambiar los precios ${Number(o.pct) > 0 ? 'subiendo' : 'bajando'} un <b>${Math.abs(o.pct)} %</b>.`, 'Actualizar'))) return;
  lista.forEach(x => { x.p.precio = x.nuevo; x.p.costo = x.costo; });
  const nombre = o.por === 'prov' ? nombreProv(o.cual) : o.cual;
  registrar(`Actualizó ${lista.length} precios de ${nombre} un ${o.pct} %${o.costo ? ' (también el costo)' : ''}`);
  guardar(); cerrarModal(); avisar(lista.length + ' precios actualizados', 'porcentaje'); refrescar();
}

/* ---------- Entregadas: todo el historial, sin que sea una lista eterna ----------
   - Buscador: por cliente, dirección, zona, Nº de venta o producto.
   - Sin buscar: la última semana a la vista; el resto del año, cerrado por mes;
     los años anteriores, cerrados por año (y adentro, por mes). */
function historialEntregas(lista){
  const h = hoy(), anio = h.slice(0, 4), q = sinTildes(EST_ENT.q).split(/\s+/).filter(Boolean);
  lista = lista.slice().sort((a, b) => b.ent.f.localeCompare(a.ent.f));
  const fila = v => `<button class="fila-lista" onclick="fichaEntrega('${v.id}')"><span><span class="p-nombre">${esc(nombreCli(v.cli))}</span>
      <span class="p-cod">${esc(v.ent.dir)} · ${esc(v.ent.zona)} · venta Nº ${v.num}</span></span><span class="muted chico">${fMedia(v.ent.f)}</span></button>`;
  const grupo = (titulo, items, abierto) => `<details class="ent-grupo" ${abierto ? 'open' : ''}><summary><span>${titulo}</span><span class="card-num">${items.length}</span></summary>
      <div class="lista">${items.map(fila).join('')}</div></details>`;
  const porMes = items => { const m = {}; items.forEach(v => (m[mesClave(v.ent.f)] = m[mesClave(v.ent.f)] || []).push(v)); return m; };
  const nombreMes = k => MESES[Number(k.slice(5)) - 1].replace(/^./, c => c.toUpperCase());
  let cuerpo;
  if (q.length){
    const r = lista.filter(v => { const t = sinTildes(nombreCli(v.cli) + ' ' + v.ent.dir + ' ' + v.ent.zona + ' ' + v.num + ' ' + v.it.map(i => i.n).join(' ')); return q.every(w => t.includes(w)); });
    cuerpo = r.length ? `<div class="card"><div class="card-cab"><div class="card-t">${r.length} entrega${r.length > 1 ? 's' : ''} encontrada${r.length > 1 ? 's' : ''}</div></div><div class="lista">${r.map(fila).join('')}</div></div>`
      : vacio('No hay entregas con «' + esc(EST_ENT.q) + '».');
  } else {
    const semana = lista.filter(v => difDias(v.ent.f, h) <= 7);
    const esteAnio = lista.filter(v => difDias(v.ent.f, h) > 7 && v.ent.f.slice(0, 4) === anio);
    const antes = lista.filter(v => v.ent.f.slice(0, 4) < anio);
    const meses = porMes(esteAnio), anios = {}; antes.forEach(v => (anios[v.ent.f.slice(0, 4)] = anios[v.ent.f.slice(0, 4)] || []).push(v));
    cuerpo = `<div class="card"><div class="card-cab"><div class="card-t">Última semana <span class="card-num">${semana.length}</span></div></div>
        ${semana.length ? `<div class="lista">${semana.map(fila).join('')}</div>` : vacio('No hubo entregas en la última semana.')}</div>
      ${Object.keys(meses).length ? `<h3 class="sub-t mt">${anio}</h3>` + Object.keys(meses).sort().reverse().map(k => grupo(nombreMes(k), meses[k])).join('') : ''}
      ${Object.keys(anios).sort().reverse().map(a => { const m = porMes(anios[a]);
        return `<details class="ent-grupo anio"><summary><span>${a}</span><span class="card-num">${anios[a].length}</span></summary>${Object.keys(m).sort().reverse().map(k => grupo(nombreMes(k), m[k])).join('')}</details>`; }).join('')}`;
  }
  return `<div class="herr">${buscador('e-q', EST_ENT.q, 'Buscar por cliente, dirección o Nº de venta', 'filtroEntQ')}<span class="muted chico">${lista.length} entregas en total</span></div>${cuerpo}`;
}
let _tEQ;
function filtroEntQ(v){ EST_ENT.q = v; clearTimeout(_tEQ); _tEQ = setTimeout(() => { RENDER.entregas(); const i = $('#e-q'); i.focus(); i.setSelectionRange(v.length, v.length); }, 220); }

function fichaEntrega(id){

  abrirModal({ titulo:'Entrega · venta Nº ' + v.num, sub:esc(nombreCli(v.cli)) + (c ? ' · ' + esc(c.tel) : ''), ancho:'md', foco:false,
    cuerpo:`<div class="fila">${chipEntrega(e.est)} <span class="chip sin-punto c-azul">${esc(e.zona)}</span></div>
      <div class="datos mt-s"><div><small>Dirección</small><b>${esc(e.dir)}</b></div><div><small>Fecha</small><b>${fLarga(e.f)}</b></div>
        <div><small>Flete</small><b>${pesos(e.flete)}</b></div><div><small>Nota</small><b>${esc(e.nota || '—')}</b></div></div>

    pie:`<button class="btn btn-linea izq" onclick="formEditarEntrega('${id}')">${ico('editar')} Cambiar datos</button>
      ${c ? `<button class="btn btn-wa" onclick="avisoWhatsApp('${id}')">${ico('wa')} Avisar</button>` : ''}
      ${e.est === 'pendiente' ? `<button class="btn btn-linea" onclick="marcarEnCamino('${id}')">${ico('camion')} Marcar en camino</button>` : ''}
      ${e.est !== 'entregada' ? `<button class="btn btn-azul" onclick="marcarEntregada('${id}')">${ico('ok')} Marcar entregada</button>` : ''}` });

function marcarEntregada(id){

function formEditarEntrega(id){

  abrirModal({ titulo:'Datos de la entrega', sub:'Venta Nº ' + v.num, ancho:'md',

function guardarEditarEntrega(id){
  const v = venta(id), o = leerForm($('#modal-cuerpo'));

  Object.assign(v.ent, { dir:o.dir, zona:o.zona, f:o.f || v.ent.f, nota:o.nota });

      ${campo('Dirección', inp('dir', ''), { ancho:true, req:true })}${campo('Zona', sel('zona', D().config.zonas, D().config.zonas[0]))}
      ${campo('Fecha', inp('f', hoy(), 'date'))}${campo('Costo del flete', inp('flete', D().config.fleteBase, 'number'), { ayuda:'Se suma al total de la venta' })}

function datosEntregaVenta(id){ const v = venta(id), c = v && cliente(v.cli); if (c){ $('[name=dir]').value = c.dir; $('[name=zona]').value = c.zona; } }

  const o = leerForm($('#modal-cuerpo')), v = venta(o.venta);

/* =====================================================================
   COMPRAS · pedidos a proveedores, recepción de mercadería y compras
   Al recibir o registrar una compra, la mercadería entra al stock en el
   mismo paso (con lote y vencimiento cuando corresponde).
   ===================================================================== */
const EST_COMP = { tab:'pedidos', prov:'' };
function verCompras(t){ EST_COMP.tab = t || 'pedidos'; if (seccionActual !== 'compras') ir('compras'); else RENDER.compras(); }
RENDER.compras = function(){
  const dueno = esDueno(), t = EST_COMP.tab;
  const abiertos = D().pedidos.filter(pd => estadoPedido(pd) !== 'recibido').length;
  encabezado('Compras y proveedores', 'Pedí, recibí y la mercadería entra sola al stock.',
    `<button class="btn btn-linea" onclick="formPedido()">${ico('mas')} Nuevo pedido</button>` + (dueno ? `<button class="btn btn-azul" onclick="formCompra()">${ico('factura')} Registrar compra</button>` : ''));
  const tabs = [['pedidos', 'Pedidos', abiertos]]; if (dueno) tabs.push(['compras', 'Compras']); tabs.push(['proveedores', 'Proveedores', D().proveedores.length]);
  $('#vista').innerHTML = pestanas(tabs, t, 'tabCompras') + '<div id="comp-cuerpo"></div>';
  ({ pedidos:pintarPedidos, compras:pintarCompras, proveedores:pintarProveedores })[t]();
};

function pedidoGuardadoWhatsApp(id){

/* ---------- Editor de renglones (pedido y compra) ---------- */
let _rengs = [], _rengCosto = false, _rengProv = '';
function optsProductos(prov){ return D().productos.slice().sort((a, b) => (b.prov === prov) - (a.prov === prov) || a.nombre.localeCompare(b.nombre)).map(p => `<option value="${esc(p.cod + ' · ' + p.nombre)}">`).join(''); }
function pintarRenglones(){
  const caja = $('#rengs'); if (!caja) return;
  caja.innerHTML = `<div class="reng reng-cab ${_rengCosto ? 'con-costo' : ''}"><span>Producto</span><span>Cantidad</span>${_rengCosto ? '<span>Costo unit.</span><span>Lote</span><span>Vence</span>' : ''}<span></span></div>` +
    _rengs.map((r, k) => { const p = prodDeTexto(r.t);
      return `<div class="reng ${_rengCosto ? 'con-costo' : ''}">
        <input list="dl-rp" value="${esc(r.t)}" placeholder="Nombre o código" onchange="_rengs[${k}].t=this.value;autoCosto(${k});pintarRenglones()" aria-label="Producto">
        <input type="number" inputmode="decimal" value="${r.c}" onchange="_rengs[${k}].c=this.value;totalRenglones()" aria-label="Cantidad">
        ${_rengCosto ? `<input type="number" inputmode="decimal" value="${r.co}" onchange="_rengs[${k}].co=this.value;totalRenglones()" aria-label="Costo">
          <input value="${esc(r.lote)}" ${p && p.vence ? '' : 'disabled placeholder="—"'} onchange="_rengs[${k}].lote=this.value" aria-label="Lote">
          <input type="date" value="${r.vence}" ${p && p.vence ? '' : 'disabled'} onchange="_rengs[${k}].vence=this.value" aria-label="Vence">` : ''}
        <button class="icon-btn" onclick="_rengs.splice(${k},1);pintarRenglones()" aria-label="Quitar">${ico('x')}</button></div>`; }).join('') +
    `<datalist id="dl-rp">${optsProductos(_rengProv)}</datalist>
     <div class="fila-fin mt-s"><button class="btn btn-linea btn-sm" onclick="_rengs.push({t:'',c:'',co:'',lote:'',vence:''});pintarRenglones()">${ico('mas')} Agregar producto</button><b class="num" id="reng-tot"></b></div>`;
  totalRenglones();
}
function autoCosto(k){ const p = prodDeTexto(_rengs[k].t); if (p && !_rengs[k].co) _rengs[k].co = p.costo; }
function totalRenglones(){ const el = $('#reng-tot'); if (el && _rengCosto) el.textContent = 'Total ' + pesos(_rengs.reduce((s, r) => s + (Number(r.c) || 0) * (Number(r.co) || 0), 0)); }
function leerRenglones(){
  const ok = [], mal = [];
  _rengs.forEach(r => { if (!r.t && !r.c) return; const p = prodDeTexto(r.t); if (!p || !(Number(r.c) > 0) || (_rengCosto && !(Number(r.co) > 0))) mal.push(r); else ok.push({ p, c:r2(Number(r.c)), co:Number(r.co) || p.costo, lote:r.lote, vence:r.vence }); });
  return { ok, mal };
}

/* ---------- Nuevo pedido ---------- */
function formPedido(prov){
  _rengProv = prov || D().proveedores[0].id; _rengCosto = false; _rengs = [{ t:'', c:'', co:'', lote:'', vence:'' }];
  abrirModal({ titulo:'Nuevo pedido', sub:'Cuando llegue la mercadería, se marca como recibido y entra al stock', ancho:'md',
    cuerpo:`<div class="form">${campo('Proveedor', sel('prov', D().proveedores.map(p => [p.id, p.nombre]), _rengProv, 'onchange="_rengProv=this.value;pintarRenglones()"'), { ancho:true })}</div>
      <div id="rengs" class="mt"></div><div class="form mt">${campo('Nota', inp('nota', '', 'text', 'placeholder="Ej.: entregar el martes"'), { ancho:true })}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="guardarPedido()">${ico('ok')} Guardar pedido</button>`,
    alAbrir: pintarRenglones });
}
function guardarPedido(){
  const { ok, mal } = leerRenglones(), o = leerForm($('#modal-cuerpo'));
  if (mal.length){ error('Revisá los productos: hay renglones incompletos'); return; }
  if (!ok.length){ error('Agregá al menos un producto'); return; }
  const pd = { id:Store.id('pd'), num:nuevoNumero('pedido'), prov:o.prov, f:hoy(), it:ok.map(x => ({ p:x.p.id, c:x.c, r:0 })), nota:o.nota, u:usuarioTxt() };
  D().pedidos.push(pd);
  registrar(`Creó el pedido Nº ${pd.num} a ${nombreProv(o.prov)}`);
  guardar(); cerrarModal(); avisar('Pedido Nº ' + pd.num + ' guardado'); fichaPedido(pd.id); refrescar();
}

/* ---------- Marcar recibido (total o parcial) ---------- */
function formRecibir(id){
  const pd = D().pedidos.find(x => x.id === id), pv = proveedor(pd.prov), dueno = esDueno();
  abrirModal({ titulo:'Recibir pedido Nº ' + pd.num, sub:esc(pv.nombre) + ' · cargá lo que llegó (puede ser parcial)', ancho:'lg',
    cuerpo:`<div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Falta</th><th class="derecha">Llegó</th>${dueno ? '<th class="derecha">Costo unit.</th>' : ''}<th>Lote</th><th>Vence</th></tr></thead>
      <tbody>${pd.it.filter(i => i.c - i.r > 0).map(i => { const p = producto(i.p);
        return `<tr><td>${esc(p.nombre)}<span class="p-cod">${p.cod}</span></td><td class="derecha num">${cant(i.c - i.r)} ${unidadCorta(p)}</td>
          <td class="derecha"><input class="mini" type="number" name="q_${i.p}" value="${r2(i.c - i.r)}" min="0" step="${pasoDe(p)}"></td>
          ${dueno ? `<td class="derecha"><input class="mini" type="number" name="co_${i.p}" value="${p.costo}"></td>` : ''}
          <td>${p.vence ? `<input class="mini izq" name="l_${i.p}" placeholder="Lote">` : '<span class="muted">—</span>'}</td>
          <td>${p.vence ? `<input class="mini fecha" type="date" name="v_${i.p}">` : '<span class="muted">—</span>'}</td></tr>`; }).join('')}</tbody></table></div></div>
      <div class="form mt">${campo('Nº de factura del proveedor', inp('fac', '', 'text', 'placeholder="Ej.: A 3190"'), { ayuda: dueno ? '' : 'Si no la tenés a mano, los dueños la completan después' })}
        ${dueno ? campo('Condición', sel('cond', [['credito', 'A crédito (' + (pv.plazo || 30) + ' días)'], ['contado', 'Al contado']], pv.plazo ? 'credito' : 'contado')) : ''}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="guardarRecepcion('${id}')">${ico('ok')} Confirmar: entra al stock</button>` });
}
function guardarRecepcion(id){
  const pd = D().pedidos.find(x => x.id === id), pv = proveedor(pd.prov), o = leerForm($('#modal-cuerpo')), dueno = esDueno();
  const it = [];
  for (const i of pd.it){
    const q = Number(o['q_' + i.p]) || 0; if (q <= 0) continue;
    const p = producto(i.p);
    if (p.vence && !o['v_' + i.p]){ error('Falta la fecha de vencimiento de ' + p.nombre); return; }
    it.push({ p:i.p, c:r2(q), co: dueno ? (Number(o['co_' + i.p]) || p.costo) : p.costo, lote: p.vence ? (o['l_' + i.p] || 'S/L') : '', vence: p.vence ? o['v_' + i.p] : '' });
  }
  if (!it.length){ error('Indicá qué llegó'); return; }
  const cond = dueno ? o.cond : 'credito';
  const cp = registrarCompra({ prov:pd.prov, fac:o.fac, f:hoy(), it, cond, venc: cond === 'credito' ? sumarDias(hoy(), pv.plazo || 30) : '', pedido:pd.id, revisar:!dueno }, 'Pedido Nº ' + pd.num);
  it.forEach(x => { const i = pd.it.find(y => y.p === x.p); i.r = r2(i.r + x.c); });
  if (cond === 'contado') nuevoDinero({ tipo:'pagoProv', prov:pd.prov, compra:cp.id, cat:'', monto:cp.tot, medio:'Efectivo', nota:'Compra al contado ' + (cp.fac || '') });
  const e = estadoPedido(pd);
  registrar(`Recibió ${e === 'recibido' ? 'completo' : 'en parte'} el pedido Nº ${pd.num} de ${pv.nombre} (${it.length} productos)`);
  guardar(); cerrarModal(); avisar('Mercadería ingresada al stock' + (e === 'parcial' ? ' · el pedido queda con saldo' : ''), 'stock'); refrescar();
}
// Entra al stock, actualiza el costo del producto y deja la compra registrada.
function registrarCompra(o, ref){
  const cp = Object.assign({ id:Store.id('cp'), u:usuarioTxt() }, o);
  cp.tot = Math.round(cp.it.reduce((s, i) => s + i.c * i.co, 0));
  cp.it = cp.it.map(i => ({ p:i.p.id || i.p, c:i.c, co:i.co, lote:i.lote || '', vence:i.vence || '' }));
  cp.it.forEach(i => { const p = producto(i.p); entrarStock(i.p, i.c, 'compra', (ref ? ref + ' · ' : 'Compra · ') + nombreProv(cp.prov) + (cp.fac ? ' · ' + cp.fac : ''), i.lote, i.vence); if (i.co) p.costo = i.co; });
  D().compras.push(cp);
  return cp;
}

/* ---------- Registrar compra (solo dueños) ---------- */
function formCompra(prov){
  if (!esDueno()) return;
  _rengProv = prov || D().proveedores[0].id; _rengCosto = true; _rengs = [{ t:'', c:'', co:'', lote:'', vence:'' }];
  const pv = proveedor(_rengProv);
  abrirModal({ titulo:'Registrar compra', sub:'Entra al stock y actualiza el costo de cada producto', ancho:'lg',
    cuerpo:`<div class="form f3">${campo('Proveedor', sel('prov', D().proveedores.map(p => [p.id, p.nombre]), _rengProv, 'onchange="_rengProv=this.value;pintarRenglones();vencCompra()"'), { req:true })}
      ${campo('Nº de factura', inp('fac', ''), { req:true })}${campo('Fecha', inp('f', hoy(), 'date'))}
      ${campo('Condición', sel('cond', [['credito', 'A crédito'], ['contado', 'Al contado']], pv.plazo ? 'credito' : 'contado', 'onchange="vencCompra()"'))}
      <div id="cp-venc">${campo('Vence el pago', inp('venc', sumarDias(hoy(), pv.plazo || 30), 'date'), { ayuda:'Pasa a cuentas a pagar' })}</div>
      <div id="cp-medio" class="hidden">${campo('Se pagó con', sel('medio', ['Efectivo', 'Transferencia', 'Débito']))}</div></div>
      <div id="rengs" class="mt"></div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="guardarCompra()">${ico('ok')} Confirmar compra</button>`,
    alAbrir: () => { pintarRenglones(); vencCompra(); } });
}
function vencCompra(){
  const cond = $('[name=cond]').value, pv = proveedor($('[name=prov]').value);
  $('#cp-venc').classList.toggle('hidden', cond !== 'credito'); $('#cp-medio').classList.toggle('hidden', cond === 'credito');
  if (cond === 'credito') $('[name=venc]').value = sumarDias($('[name=f]').value || hoy(), pv.plazo || 30);
}
function guardarCompra(){
  const o = leerForm($('#modal-cuerpo')), { ok, mal } = leerRenglones();
  if (!o.fac){ error('Falta el número de factura'); return; }
  if (mal.length){ error('Revisá los productos: falta cantidad o costo'); return; }
  if (!ok.length){ error('Agregá al menos un producto'); return; }
  const sinVence = ok.find(x => x.p.vence && !x.vence); if (sinVence){ error('Falta el vencimiento de ' + sinVence.p.nombre); return; }
  const cp = registrarCompra({ prov:o.prov, fac:o.fac, f:o.f || hoy(), it:ok.map(x => ({ p:x.p.id, c:x.c, co:x.co, lote:x.p.vence ? (x.lote || 'S/L') : '', vence:x.vence })), cond:o.cond, venc:o.cond === 'credito' ? o.venc : '', pedido:null });
  if (o.cond === 'contado') nuevoDinero({ f:cp.f, tipo:'pagoProv', prov:o.prov, compra:cp.id, cat:'', monto:cp.tot, medio:o.medio, nota:'Compra al contado ' + cp.fac });
  registrar(`Registró la compra ${cp.fac} de ${nombreProv(o.prov)} por ${pesos(cp.tot)} (${o.cond === 'credito' ? 'a crédito' : 'contado'})`);
  guardar(); cerrarModal(); avisar('Compra registrada: la mercadería entró al stock', 'stock'); refrescar();
}

    <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Fecha</th><th>Proveedor</th><th>Factura</th><th>Productos</th><th>Condición</th><th>Pago</th><th class="derecha">Total</th></tr></thead>

function fichaCompra(id){

function guardarFichaCompra(id){

/* ===== js/16-estado-cuenta.js ===== */
/* =====================================================================
   ESTADO DE CUENTA DEL CLIENTE (PDF y Excel)
   Cuenta corriente: ventas a cuenta (debe) y pagos (haber), con el saldo
   acumulado. Si el cliente no compra a cuenta, lista sus compras (pagadas).
   ===================================================================== */
function movsCuenta(id){
  const movs = [];
  D().ventas.filter(v => v.cli === id && v.pago === 'Cuenta corriente' && ventaActiva(v)).forEach(v => movs.push({ f:v.f, h:v.h, t:'Venta Nº ' + v.num, debe:netoVenta(v), haber:0, id:v.id }));
  D().cobros.filter(p => p.cli === id).forEach(p => movs.push({ f:p.f, h:'23:59', t:'Pago · ' + p.medio + (p.nota ? ' · ' + p.nota : ''), debe:0, haber:p.monto }));
  movs.sort((a, b) => (a.f + a.h).localeCompare(b.f + b.h));
  let acu = 0; movs.forEach(m => { acu += m.debe - m.haber; m.saldo = acu; });
  return movs;
}
function datosEstadoCuenta(id){
  const c = cliente(id), cc = movsCuenta(id);
  if (cc.length) return { c, tipo:'cc', filas:cc, saldo:cc[cc.length - 1].saldo };
  const filas = D().ventas.filter(v => v.cli === id && ventaActiva(v)).sort((a, b) => (a.f + a.h).localeCompare(b.f + b.h))
    .map(v => ({ f:v.f, t:'Venta Nº ' + v.num + ' · ' + v.pago, debe:netoVenta(v), haber:netoVenta(v), saldo:0 }));
  return { c, tipo:'contado', filas, saldo:0 };
}
function estadoCuenta(id){
  const e = datosEstadoCuenta(id);
  abrirModal({ titulo:'Estado de cuenta', sub:esc(e.c.nombre) + ' · al ' + fCorta(hoy()), ancho:'modal-sm', foco:false,
    cuerpo:`<p class="t2">${e.tipo === 'cc' ? 'Saldo de la cuenta corriente: <b>' + pesos(e.saldo) + '</b> (' + e.filas.length + ' movimientos).' : 'No compra a cuenta: el estado lista sus compras, todas pagadas.'}</p>
      <div class="opciones col mt">
        <button class="opcion" onclick="estadoCuentaPDF('${id}')">${ico('factura')} Descargar en PDF <small>para imprimir o mandárselo</small></button>
        <button class="opcion" onclick="estadoCuentaExcel('${id}')">${ico('descargar')} Descargar en Excel <small>para trabajar los números</small></button></div>`,
    pie:`<button class="btn btn-linea" onclick="fichaCliente('${id}')">Volver</button>` });
}
function nombreArchivoEC(c){ return NEGOCIO.nombre + ' - Estado de cuenta - ' + c.nombre.replace(/[\\/:*?"<>|]/g, '') + ' - ' + hoy(); }
function descargarArchivo(blob, nombre){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function estadoCuentaExcel(id){
  const e = datosEstadoCuenta(id), c = e.c;
  const cel = v => { v = v == null ? '' : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lineas = [[NEGOCIO.nombre + ' · ' + NEGOCIO.rubro], ['Estado de cuenta al ' + fCorta(hoy())], [],
    ['Cliente', c.nombre], [c.tdoc, c.doc], ['Dirección', c.dir], ['Teléfono', c.tel]]
    .concat(c.limite ? [['Límite de crédito', c.limite]] : [])
    .concat([[], ['Fecha', 'Detalle', 'Debe', 'Haber', 'Saldo']])
    .concat(e.filas.map(m => [fCorta(m.f), m.t, m.debe ? numCSV(m.debe) : '', m.haber ? numCSV(m.haber) : '', numCSV(m.saldo)]))
    .concat([[], ['', 'SALDO A LA FECHA', '', '', numCSV(e.saldo)]]);
  const txt = '﻿' + lineas.map(f => f.map(cel).join(';')).join('\r\n');
  descargarArchivo(new Blob([txt], { type:'text/csv;charset=utf-8' }), nombreArchivoEC(c) + '.csv');
  registrar('Descargó el estado de cuenta de ' + c.nombre + ' (Excel)'); guardar();
  avisar('Se descargó el estado de cuenta (se abre con Excel)', 'descargar');
}

// El PDF se arma en el navegador con jsPDF (se carga solo la primera vez que se usa).
let _jspdf = null;
function cargarJsPDF(){
  if (_jspdf) return _jspdf;
  const s = src => new Promise((ok, mal) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = mal; document.head.appendChild(e); });
  _jspdf = s('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    .then(() => s('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'))
    .catch(e => { _jspdf = null; throw e; });
  return _jspdf;
}
async function estadoCuentaPDF(id){
  const e = datosEstadoCuenta(id), c = e.c;
  try { await cargarJsPDF(); } catch (err){ error('No se pudo armar el PDF (¿hay internet?). Probá de nuevo.'); return; }
  const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
  const azul = [10, 74, 114], gris = [107, 111, 114], texto = [27, 43, 56];
  const logo = await logoPNG();   // el hexágono de Yedeco (427 × 370)
  if (logo) try { doc.addImage(logo, 'PNG', 14, 12, 30, 26, undefined, 'FAST'); } catch (err) {}
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.setTextColor(...azul); doc.text(NEGOCIO.nombre.toUpperCase(), 49, 21);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...gris);
  doc.text([NEGOCIO.rubro, 'RUT ' + NEGOCIO.rut + ' · ' + NEGOCIO.direccion + ' · Tel. ' + NEGOCIO.tel], 49, 27);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...azul); doc.text('ESTADO DE CUENTA', 196, 19, { align:'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...gris); doc.text('al ' + fCorta(hoy()), 196, 25, { align:'right' });
  doc.setDrawColor(...azul); doc.setLineWidth(.8); doc.line(14, 44, 196, 44);
  doc.setTextColor(...texto); doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.text(c.nombre, 14, 52);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
  doc.text([c.tdoc + ' ' + c.doc + ' · ' + c.dir + ' · Tel. ' + c.tel,
    c.limite ? 'Límite de crédito: ' + pesos(c.limite) : (e.tipo === 'cc' ? '' : 'Compras al contado')], 14, 58);
  doc.autoTable({ startY:68, head:[['Fecha', 'Detalle'].concat(['Debe', 'Haber', 'Saldo'].map(t => ({ content:t, styles:{ halign:'right' } })))],
    body:e.filas.map(m => [fCorta(m.f), m.t, m.debe ? pesos(m.debe) : '', m.haber ? pesos(m.haber) : '', pesos(m.saldo)]),
    foot:[['', 'Saldo a la fecha', '', '', { content:pesos(e.saldo), styles:{ halign:'right' } }]],
    styles:{ font:'helvetica', fontSize:9, cellPadding:2.2 }, headStyles:{ fillColor:azul },
    footStyles:{ fillColor:[239, 245, 249], textColor:texto, fontStyle:'bold' }, alternateRowStyles:{ fillColor:[247, 249, 251] },
    columnStyles:{ 0:{ cellWidth:24 }, 2:{ halign:'right' }, 3:{ halign:'right' }, 4:{ halign:'right', fontStyle:'bold' } } });
  doc.setFontSize(8.5); doc.setTextColor(...gris);

   (lo vendido sin IVA, el % que le corresponde según la escala, la comisión
   estimada y cuánto le falta para el tramo siguiente), los adelantos y los pagos.
   ===================================================================== */
function pintarMiPersonal(){
  const f = D().func, h = hoy(), mes = EST_PERS.miMes || inicioMes(h), clave = mesClave(mes);
  encabezado('Mi resumen', esc(f.nombre) + ' · ' + esc(f.cargo), '');

  // Días del mes
  const a = D().asist, tot = {}; Object.keys(ASISTENCIA).forEach(k => tot[k] = 0);
  Object.keys(a).forEach(d => { if (mesClave(d) === clave && (d <= h || a[d] === 'L' || a[d] === 'J') && tot[a[d]] != null) tot[a[d]]++; });   // licencias y faltas avisadas: también las planificadas
  const trabajados = tot.T + tot.M / 2;
  const proximos = Object.keys(a).filter(d => d > h && (a[d] === 'L' || a[d] === 'J')).sort().slice(0, 6);

  // Comisión del mes: escala sobre lo cobrado sin IVA (menos devoluciones)
  const r = comisionMes(clave), liq = r.liq, av = avanceTramo(r), enCurso = clave === mesClave(h);
  const sinCobrarMes = enCurso ? r.sinCobrar : [];
  const lista = r.ventas.concat(sinCobrarMes).sort((x, y) => (y.f + y.h).localeCompare(x.f + x.h));

  // Pagos del mes (sueldo, adelantos y comisiones)
  const pagosMes = pagosFunc().filter(m => mesClave(m.f) === clave).sort((x, y) => y.f.localeCompare(x.f));
  const adelantos = pagosMes.filter(m => m.concepto === 'Adelanto').reduce((s, m) => s + m.monto, 0);
  const ultSueldo = pagosFunc().filter(m => m.concepto === 'Sueldo').sort((x, y) => y.f.localeCompare(x.f))[0];

  const numero = (t, v, sub) => `<div class="numero"><small>${t}</small><b class="num">${v}</b><span>${sub}</span></div>`;
  const filaPago = m => `<div class="fila-lista"><span><span class="p-nombre">${m.concepto || 'Sueldo'}</span><span class="p-cod">${fLarga(m.f)} · ${m.medio}</span></span><b class="num">${pesos(m.monto)}</b></div>`;

  $('#vista').innerHTML = `
    <div class="mes-nav"><button class="icon-btn" onclick="moverMiMes(-1)" aria-label="Mes anterior">${ico('izq')}</button>
      <b>${fMes(mes)}</b><button class="icon-btn" onclick="moverMiMes(1)" aria-label="Mes siguiente" ${clave >= mesClave(h) ? 'disabled' : ''}>${ico('der')}</button></div>
    <div class="numeros">
      ${numero('Días trabajados', String(trabajados).replace('.', ','), tot.M ? tot.M + ' medio' + (tot.M > 1 ? 's' : '') + ' día' : 'en ' + MESES[aFecha(mes).getMonth()])}
      ${numero(liq ? 'Comisión del mes' : 'Comisión estimada', pesos2(r.com), pct(r.pct) + ' sobre ' + pesos(r.base) + ' sin IVA')}
      ${numero('Adelantos', pesos(adelantos), adelantos ? 'se descuentan del sueldo' : 'no pediste adelantos')}
    </div>

    <div class="grid g-2 mt">
      <div class="card"><div class="card-cab"><div class="card-t">Tus días</div></div>
        <div class="fila">${Object.keys(ASISTENCIA).map(k => `<span class="chip ${ASISTENCIA[k].c}">${ASISTENCIA[k].t}: ${tot[k]}</span>`).join('')}</div>
        ${calendarioLectura(mes)}
        ${proximos.length ? `<h3 class="sub-t mt">Lo que viene</h3><div class="lista">${proximos.map(d => `<div class="fila-lista"><span>${fLarga(d)}</span><span class="chip ${ASISTENCIA[a[d]].c}">${ASISTENCIA[a[d]].t}</span></div>`).join('')}</div>` : ''}
      </div>
      <div class="card"><div class="card-cab"><div class="card-t">Tus pagos</div></div>
        ${ultSueldo ? `<div class="caja-info ok">${ico('dinero')}<span>Último sueldo pagado: <b>${fLarga(ultSueldo.f)}</b> · ${pesos(ultSueldo.monto)}</span></div>` : ''}
        ${pagosMes.length ? `<div class="lista mt-s">${pagosMes.map(filaPago).join('')}</div>` : vacio('No hubo pagos en este mes.')}
      </div>
    </div>

    <div class="card mt"><div class="card-cab"><div class="card-t">Tu comisión de ${MESES[aFecha(mes).getMonth()]}</div>
        ${liq ? `<span class="chip ${liq.pagada ? 'c-verde' : 'c-amarillo'}">${liq.pagada ? 'Pagada el ' + fMedia(liq.fPago) : 'Liquidada, a pagar'}</span>` : ''}</div>
      <div class="mi-com">
        <div><small>Vendido en el mes (sin IVA)</small><b class="num">${pesos2(r.base)}</b></div>
        <div><small>${liq ? 'Te correspondió' : 'Te corresponde hoy'}</small><b class="num">${pct(r.pct)}</b></div>
        <div><small>${liq ? 'Comisión' : 'Comisión estimada'}</small><b class="num">${pesos2(r.com)}</b></div>
      </div>
      ${!liq ? (av.ultimo ? `<div class="caja-info ok mt-s">${ico('estrella')}<span><b>¡Ya estás en el ${pct(r.pct)}!</b> Se aplica sobre todo lo que vendiste en el mes.</span></div>`
        : `<div class="avance-tramo mt-s"><div class="avance grande" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(av.pct)}" aria-label="Avance hacia el ${pct(av.pctSig)}"><span style="width:${av.pct}%"></span></div>
          <div class="fila-fin"><span>Te faltan <b>${pesos2(av.falta)}</b> (sin IVA) para pasar al ${pct(av.pctSig)}</span><small class="muted">${pesos(r.tramo.sig.desde)}</small></div></div>`) : ''}
      ${sinCobrarMes.length ? `<p class="t2 mt-s">Vas a sumar <b>${pesos2(r.sinCobrarSin)}</b> (sin IVA) más cuando los clientes paguen ${sinCobrarMes.length} venta${sinCobrarMes.length === 1 ? '' : 's'} a cuenta.</p>` : ''}
      ${lista.length ? `<details class="mt-s"><summary class="link">Ver lo que suma cada venta (${lista.length})</summary>
        <div class="tabla-caja mt-s"><div class="tabla-scroll"><table class="tabla tabla-simple"><thead><tr><th>Venta</th><th class="derecha">Con IVA</th><th class="derecha">Suma sin IVA</th><th></th></tr></thead>
        <tbody>${lista.map(v => { const c = comisionVenta(v), cob = !!fechaCobro(v);
          return `<tr><td><span class="p-nombre">${esc(nombreCli(v.cli))}</span><span class="p-cod">Nº ${v.num} · ${fMedia(v.f)}${c.devSin ? ' · con devolución' : ''}</span></td><td class="derecha num">${pesos(c.con - c.devCon)}</td>
            <td class="derecha num fuerte">${pesos2(c.base)}</td><td class="derecha">${cob ? '' : '<span class="chip c-amarillo">Falta que pague</span>'}</td></tr>`; }).join('')}</tbody></table></div></div></details>`
        : vacio('No hay ventas cobradas tuyas en este mes.')}
      <p class="muted chico mt-s">Se cuentan las ventas cobradas en el mes, sin IVA y menos devoluciones. Escala: ${escalaComision().map((t, i) => textoTramo(escalaComision(), i).toLowerCase() + ' → ' + pct(t.pct)).join(' · ')}, sobre todo lo del mes. Es salario: lleva aportes al BPS.</p>
    </div>`;
}
function moverMiMes(n){ EST_PERS.miMes = sumarMeses(EST_PERS.miMes || inicioMes(hoy()), n); pintarMiPersonal(); }
// Calendario del mes, solo para mirar
function calendarioLectura(mes){
  const ini = aFecha(mes), dias = aFecha(finMes(mes)).getDate(), a = D().asist, h = hoy();
  let html = '<div class="cal-cab mt">' + ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<span>${d}</span>`).join('') + '</div><div class="cal cal-chico">' + '<span></span>'.repeat((ini.getDay() + 6) % 7);
  for (let d = 1; d <= dias; d++){
    const f = mes.slice(0, 8) + p2(d), v = a[f];
    html += `<div class="cal-d ${v ? 'as-' + v : ''} ${f === h ? 'hoy' : ''} ${f > h ? 'futuro' : ''}" title="${fLarga(f)}${v ? ': ' + ASISTENCIA[v].t : ''}"><b>${d}</b>${v ? `<small>${ASISTENCIA[v].t}</small>` : ''}</div>`;
  }
  return html + '</div>';
}


/* ===== js/17-personal.js ===== */

   Lucas (vendedor) ve solo lo suyo, para consultar: 17-mi-personal.js

const EST_PERS = { tab:'ficha', mes:null, mesCom:null };

/* ---------- Asistencia: se toca un día y se elige qué pasó.
   Días pasados: trabajó, medio día, falta, falta avisada o licencia.
   Días futuros (para planificar): licencia o falta avisada. ---------- */
const MESES_ADELANTE = 6;
function pintarAsistencia(){

  const offset = (ini.getDay() + 6) % 7, a = D().asist, tot = {}; Object.keys(ASISTENCIA).forEach(k => tot[k] = 0);

  let celdas = '<div class="cal-cab">' + ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<span>${d}</span>`).join('') + '</div><div class="cal">' + '<span></span>'.repeat(offset);
  for (let d = 1; d <= dias; d++){
    const f = mes.slice(0, 8) + p2(d), v = a[f], fut = f > h;
    if (v && tot[v] != null) tot[v]++;
    celdas += `<button class="cal-d ${v ? 'as-' + v : ''} ${f === h ? 'hoy' : ''} ${fut ? 'futuro' : ''}" onclick="elegirAsist('${f}')" aria-label="${fLarga(f)}: ${v ? ASISTENCIA[v].t : 'sin marcar'}"><b>${d}</b><small>${v ? ASISTENCIA[v].t : ''}</small></button>`;

      <div class="card-t" style="min-width:170px;text-align:center">${fMes(mes)}</div><button class="icon-btn" onclick="moverMesAsist(1)" aria-label="Mes siguiente" ${mes >= tope ? 'disabled' : ''}>${ico('der')}</button></div>
      <div class="fila">${Object.keys(ASISTENCIA).filter(k => tot[k]).map(k => `<span class="chip ${ASISTENCIA[k].c}">${ASISTENCIA[k].t}: ${tot[k]}</span>`).join('')}</div></div>
    ${celdas}<p class="muted chico mt-s">Tocá un día para marcarlo. En los días que vienen podés cargar <b>licencias</b> y <b>faltas avisadas</b> para planificar.
      Días trabajados en el mes: <b>${String(trabajados).replace('.', ',')}</b>${tot.M ? ' (los medios días cuentan como ½)' : ''}.</p></div>`;
}
function moverMesAsist(n){ EST_PERS.mes = sumarMeses(EST_PERS.mes || inicioMes(hoy()), n); pintarAsistencia(); }
function elegirAsist(f){
  const fut = f > hoy(), actual = D().asist[f];
  const opciones = Object.keys(ASISTENCIA).filter(k => !fut || ASISTENCIA[k].futuro);

}

/* ---------- Sueldo y adelantos (los adelantos se descuentan al liquidar) ---------- */

  const f = D().func, mes = mesClave(hoy()), pagos = pagosFunc();
  const adelMes = pagos.filter(m => m.concepto === 'Adelanto' && mesClave(m.f) === mes).reduce((s, m) => s + m.monto, 0);

      <tbody>${pagos.slice(0, 40).map(m => `<tr><td>${fMedia(m.f)}</td><td><span class="chip sin-punto ${m.concepto === 'Adelanto' ? 'c-amarillo' : m.concepto === 'Comisión' ? 'c-naranja' : 'c-azul'}">${m.concepto || 'Sueldo'}</span></td><td class="t2">${esc(m.nota)}</td><td>${m.medio}</td><td class="derecha num fuerte">${pesos(m.monto)}</td></tr>`).join('')}</tbody></table></div></div>`;

/* ---------- Comisiones (por mes, escala sobre lo cobrado sin IVA) ---------- */
function estadoLiq(l){ return l ? (l.pagada ? `<span class="chip c-verde">Pagada el ${fMedia(l.fPago)}</span>` : '<span class="chip c-amarillo">Liquidada · a pagar</span>') : '<span class="chip c-gris">Sin liquidar</span>'; }
function moverMesCom(n){ const h = hoy(); let m = mesClave(sumarMeses((EST_PERS.mesCom || mesClave(h)) + '-01', n)); if (m > mesClave(h)) m = mesClave(h); EST_PERS.mesCom = m; pintarComisiones(); }
// Cuánto le falta para el tramo siguiente (para la barra de avance)
function avanceTramo(r){
  const sig = r.tramo.sig; if (!sig) return { ultimo:true, pct:100 };
  return { ultimo:false, falta:r2(sig.desde - r.base), pctSig:sig.pct, pct:Math.max(0, Math.min(100, r.base / sig.desde * 100)) };
}
const mesDeLiq = l => l.mes || mesClave(l.desde);
function pintarComisiones(){
  const h = hoy(), mesAct = mesClave(h), mes = EST_PERS.mesCom || mesAct, r = comisionMes(mes), l = r.liq, n = USUARIOS[VENDEDOR].nombre;
  const liqs = D().liquidaciones.slice().sort((a, b) => b.desde.localeCompare(a.desde)), av = avanceTramo(r), iva = l && l.ivaPct != null ? l.ivaPct : D().config.iva;

async function liquidarComisiones(){
  const h = hoy(), mes = EST_PERS.mesCom || mesClave(h), r = comisionMes(mes), enCurso = mes === mesClave(h);
  if (r.liq) return;
  if (!(await confirmar('Liquidar la comisión de ' + fMes(mes + '-01'), `<b>${r.ventas.length} ventas</b> cobradas · base sin IVA <b>${pesos2(r.base)}</b> · tramo ${r.tramo.i + 1} → <b>${pct(r.pct)}</b> = comisión de <b>${pesos2(r.com)}</b>.
    ${enCurso ? '<br><br>⚠ El mes todavía no terminó: lo que se cobre después de hoy pasa a la liquidación del mes que viene.' : ''}<br><br>Queda «a pagar» hasta que la marques como pagada.`, 'Liquidar'))) return;
  const l = { id:Store.id('lq'), mes, desde:mes + '-01', hasta: enCurso ? h : finMes(mes + '-01'), ventas:r.ventas.map(v => v.id),
    con:r2(r.con), iva:r.iva, ivaPct:D().config.iva, sin:r.sin, devSin:r.devSin, aj:r.aj, base:r.base, tramo:r.tramo.i + 1, pct:r.pct, monto:r.com, f:h, pagada:false, fPago:'', u:usuarioTxt() };
  r.ajustes.forEach(a => a.liq = l.id);
  D().liquidaciones.push(l);
  registrar(`Liquidó la comisión de ${fMes(mes + '-01')}: base ${pesos2(l.base)} sin IVA × ${pct(l.pct)} = ${pesos2(l.monto)}`);
  guardar(); avisar('Comisión liquidada: ' + pesos2(l.monto)); pintarComisiones(); pintarNav();
}
function pagarLiquidacion(id){
  const l = D().liquidaciones.find(x => x.id === id);
  abrirModal({ titulo:'Pagar comisión', sub:`${fMes(mesDeLiq(l) + '-01')} · ${pesos2(l.monto)}`, ancho:'modal-sm',
    cuerpo:`<div class="form">${campo('Fecha de pago', inp('f', hoy(), 'date'))}${campo('Medio', sel('medio', ['Transferencia', 'Efectivo']))}</div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button><button class="btn btn-azul" onclick="confirmarPagoLiq('${id}')">Marcar pagada</button>` });
}
function confirmarPagoLiq(id){
  const l = D().liquidaciones.find(x => x.id === id), o = leerForm($('#modal-cuerpo'));
  l.pagada = true; l.fPago = o.f || hoy();
  nuevoDinero({ f:l.fPago, tipo:'gasto', cat:'Sueldos', concepto:'Comisión', monto:l.monto, medio:o.medio, nota:'Comisión de ' + fMes(mesDeLiq(l) + '-01') });
  registrar(`Pagó la comisión de ${fMes(mesDeLiq(l) + '-01')}: ${pesos2(l.monto)}`);
  guardar(); cerrarModal(); avisar('Comisión marcada como pagada', 'dinero'); pintarComisiones();
}

function pintarDinero(){
  const e = EST_FIN, mes = e.mes || mesClave(hoy());
  const lista = [];
  D().dinero.forEach(m => { if (mesClave(m.f) === mes && (!e.tipo || e.tipo === m.tipo)) lista.push({ f:m.f, h:m.h, tipo:TIPOS_DINERO[m.tipo], det:(m.cat ? m.cat + ' · ' : '') + (m.socio ? m.socio + ' · ' : '') + (m.prov ? nombreProv(m.prov) + ' · ' : '') + (m.nota || ''), medio:m.medio, monto:m.monto, entra:m.tipo === 'aporte', u:m.u }); });
  if (!e.tipo || e.tipo === 'cobro') D().cobros.forEach(c => { if (mesClave(c.f) === mes) lista.push({ f:c.f, h:'', tipo:'Cobro de cuenta corriente', det:nombreCli(c.cli) + (c.nota ? ' · ' + c.nota : ''), medio:c.medio, monto:c.monto, entra:true, u:c.u }); });
  lista.sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
  const meses = Array.from({ length:7 }, (_, k) => mesClave(sumarMeses(hoy(), -k)));

      </div>
    <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla"><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Medio</th><th class="derecha">Monto</th></tr></thead>
      <tbody>${filas.map(m => `<tr><td>${fMedia(m.f)}</td><td>${m.tipo}</td><td class="t2">${esc(m.det)}</td><td>${m.medio}</td><td class="derecha num fuerte ${m.entra ? 'pos' : ''}">${m.entra ? '+ ' : '− '}${pesos(m.monto)}</td></tr>`).join('')}</tbody></table></div>

  const retiros = D().dinero.filter(m => m.tipo === 'retiro' && mesClave(m.f) === mes).reduce((s, m) => s + m.monto, 0);
  const cats = Object.keys(r.porCat).sort((a, b) => r.porCat[b] - r.porCat[a]), maxCat = Math.max(1, ...cats.map(c => r.porCat[c]));
  $('#fin-cuerpo').innerHTML = `<div class="herr"><select class="sel" onchange="EST_FIN.mes=this.value;pintarResultado()" aria-label="Mes">${meses.map(m => `<option value="${m}" ${m === mes ? 'selected' : ''}>${fMes(m + '-01')}</option>`).join('')}</select>

    <div class="card resultado">

      <div class="res-fila sub"><span>= Ganancia bruta <small>${pct(r.vendido ? (r.vendido - r.cmv) / r.vendido * 100 : 0)} sobre ventas</small></span><b class="num">${pesos(r.vendido - r.cmv)}</b></div>
      <div class="res-fila menos"><span>− Gastos del mes</span><b class="num">${pesos(r.gastos)}</b></div>
      <div class="res-fila total ${r.ganancia < 0 ? 'neg' : ''}"><span>= Ganancia <small>margen ${pct(r.margen)}</small></span><b class="num">${pesos(r.ganancia)}</b></div>
      <p class="muted chico mt-s">Los retiros de los socios (${pesos(retiros)} este mes) no se restan: son reparto de la ganancia, no un gasto.</p>
      <div class="res-fila mt"><span>Valor del stock hoy <small>a costo · a precio de venta ${pesos(valorStock().venta)}</small></span><b class="num">${pesos(valorStock().costo)}</b></div></div>
    <div class="grid g-2 mt">
      <div class="card"><div class="card-cab"><div class="card-t">Ventas y gastos<small>Últimos 6 meses</small></div>
        <div class="leyenda"><span><i class="lv"></i>Ventas</span><span><i class="lg"></i>Gastos</span></div></div>${graficoSeisMeses(seis)}</div>
      <div class="card"><div class="card-cab"><div class="card-t">Gastos por categoría<small>${fMes(mes + '-01')}</small></div></div>
        ${cats.map(c => `<div class="barra-cat"><div class="fila-fin"><span>${c}</span><b class="num">${pesos(r.porCat[c])}</b></div><div class="avance"><span style="width:${r.porCat[c] / maxCat * 100}%"></span></div></div>`).join('') || vacio('Sin gastos este mes.')}</div>
    </div>`;
}
function graficoSeisMeses(datos){
  const W = 560, H = 250, pad = { l:52, r:10, t:14, b:34 }, max = Math.max(1, ...datos.map(d => Math.max(d.vendido, d.gastos)));
  const paso = Math.pow(10, Math.floor(Math.log10(max))), tope = Math.ceil(max / paso) * paso;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / tope), ancho = (W - pad.l - pad.r) / datos.length, bw = Math.min(26, ancho * .3);
  const lineas = [0, .25, .5, .75, 1].map(k => { const v = tope * k; return `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" class="gr-lin"/><text x="${pad.l - 8}" y="${y(v) + 4}" class="gr-eje" text-anchor="end">${v >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',') + ' M' : Math.round(v / 1000) + ' mil'}</text>`; }).join('');
  const barras = datos.map((d, i) => { const x = pad.l + ancho * i + ancho / 2, m = aFecha(d.mes + '-01');
    return `<g><title>${fMes(d.mes + '-01')}: ventas ${pesos(d.vendido)}, gastos ${pesos(d.gastos)}, ganancia ${pesos(d.ganancia)}</title>
      <rect x="${x - bw - 2}" y="${y(d.vendido)}" width="${bw}" height="${Math.max(0, y(0) - y(d.vendido))}" rx="3" class="gr-v"/>
      <rect x="${x + 2}" y="${y(d.gastos)}" width="${bw}" height="${Math.max(0, y(0) - y(d.gastos))}" rx="3" class="gr-g"/>
      <text x="${x}" y="${H - 12}" class="gr-eje" text-anchor="middle">${MESES_C[m.getMonth()]}</text></g>`; }).join('');
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas y gastos de los últimos 6 meses">${lineas}${barras}</svg>`;
}

/* ---------- Comisión de Lucas: tasa de IVA y escala mensual (tabla editable) ----------
   Cada tramo: hasta qué base del mes (sin IVA) llega y qué % se aplica. El último no tiene tope.
   La escala es una lista: para sumar un tramo se agrega otra fila en CONFIG_INICIAL.escalaComision. */
function tarjetaEscala(){
  const c = D().config, esc_ = escalaComision(), n = USUARIOS[VENDEDOR].nombre;
  const filas = esc_.map((t, i) => { const sig = esc_[i + 1];
    return `<tr><td class="t2">Tramo ${i + 1}</td><td>${sig ? `${i ? 'De ' + pesos(t.desde) + ' hasta' : 'Hasta'} <span class="conf-in en-linea"><span>$</span><input type="number" value="${sig.desde - 1}" onchange="guardarTope(${i},this.value)" aria-label="Tope del tramo ${i + 1}"></span>` : 'Desde ' + pesos(t.desde) + ' en adelante'}</td>
      <td class="derecha"><span class="conf-in en-linea"><input type="number" step="0.1" value="${t.pct}" onchange="guardarPctTramo(${i},this.value)" aria-label="Porcentaje del tramo ${i + 1}"><span>%</span></span></td></tr>`; }).join('');
  return `<div class="card mt"><div class="card-cab"><div class="card-t">Comisión de ${esc(n)}<small>Escala mensual sobre lo cobrado en el mes, sin IVA y menos devoluciones. El % del tramo alcanzado se aplica sobre toda la base del mes.</small></div></div>
    <div class="conf-fila"><div><b>Tasa de IVA</b><small>Los precios incluyen IVA: para la comisión se divide lo cobrado entre 1 + IVA</small></div><div class="conf-in"><input type="number" step="0.1" value="${c.iva}" onchange="guardarRegla('iva',this.value,'Tasa de IVA')" aria-label="Tasa de IVA"><span>%</span></div></div>
    <div class="tabla-caja mt-s"><table class="tabla tabla-escala"><thead><tr><th>Tramo</th><th>Base del mes (sin IVA)</th><th class="derecha">Comisión</th></tr></thead><tbody>${filas}</tbody></table></div>
    <p class="muted chico mt-s">Ejemplo: base de ${pesos(280000)} → ${pct(tramoComision(280000).pct)} = ${pesos2(280000 * tramoComision(280000).pct / 100)} · base de ${pesos(320000)} → ${pct(tramoComision(320000).pct)} = ${pesos2(320000 * tramoComision(320000).pct / 100)}.</p></div>`;
}
function guardarTope(i, v){
  const esc_ = escalaComision(), n = Math.round(Number(v));
  const min = i ? esc_[i].desde : 0, max = esc_[i + 2] ? esc_[i + 2].desde - 2 : Infinity;
  if (!(n >= min && n <= max)){ error('El tope tiene que quedar entre el tramo anterior y el siguiente'); pintarReglas(); return; }
  esc_[i + 1].desde = n + 1; D().config.escalaComision = esc_;
  registrar(`Cambió el tope del tramo ${i + 1} de la comisión a ${pesos(n)} (sin IVA)`); guardar(); avisar('Escala guardada'); pintarReglas();
}
function guardarPctTramo(i, v){
  const esc_ = escalaComision(), n = Number(v); if (!(n >= 0 && n <= 100)){ error('Porcentaje no válido'); pintarReglas(); return; }
  esc_[i].pct = n; D().config.escalaComision = esc_;
  registrar(`Cambió la comisión del tramo ${i + 1} a ${pct(n)}`); guardar(); avisar('Escala guardada'); pintarReglas();
}

function imprimirHojaRuta(dia){
  const lista = ventasConEntrega().filter(v => v.ent.est !== 'entregada' && v.ent.f <= dia).sort((a, b) => a.ent.zona.localeCompare(b.ent.zona) || a.ent.dir.localeCompare(b.ent.dir));
  if (!lista.length){ avisar('No hay entregas pendientes para imprimir', 'info'); return; }
  let zona = '', k = 0;
  imprimir('HOJA DE RUTA', fLarga(dia) + ' · ' + lista.length + ' entrega' + (lista.length > 1 ? 's' : ''),
    lista.map(v => { const c = cliente(v.cli), cab = v.ent.zona !== zona ? `<div class="imp-zona">${esc(zona = v.ent.zona)}</div>` : '';
      return cab + `<div class="imp-ent"><div class="imp-ent-n">${++k}</div><div class="imp-ent-c"><b>${esc(nombreCli(v.cli))}</b> · ${c ? esc(c.tel) : ''} · Venta Nº ${v.num}${v.ent.f < dia ? ' · <b>ATRASADA</b>' : ''}
        <div>${esc(v.ent.dir)}</div>${v.ent.nota ? `<div><i>Nota: ${esc(v.ent.nota)}</i></div>` : ''}
        <ul>${v.it.filter(i => i.c - i.e > 0).map(i => { const p = producto(i.p); return `<li>${cant(i.c - i.e)} ${unidadCorta(p)} · ${esc(i.n)}</li>`; }).join('')}</ul></div>
        <div class="imp-firma">Recibí conforme<br><br>Firma: ____________________</div></div>`; }).join(''));
}
function imprimirCierre(dia){
  const c = cajaDelDia(dia), ci = c.cierre;
  const filas = (arr, s) => arr.map(x => `<tr><td>${x.t} (${x.n})</td><td class="d">${s} ${pesos(x.monto)}</td></tr>`).join('');
  imprimir('CIERRE DE CAJA', fLarga(dia) + ' · cerrada a las ' + ci.h,
    `<table class="imp-t imp-caja"><tbody><tr><td>Apertura</td><td class="d">${pesos(c.ap)}</td></tr>${filas(c.ing, '+')}${filas(c.egr, '−')}
      <tr class="imp-tot"><td>Debería haber</td><td class="d">${pesos(c.esperado)}</td></tr><tr><td>Se contó</td><td class="d">${pesos(ci.contado)}</td></tr>
      <tr class="imp-tot"><td>Diferencia</td><td class="d">${difTxt(ci.contado - ci.esperado)}</td></tr></tbody></table>
    ${Object.keys(c.otros).length ? `<table class="imp-t"><thead><tr><th>Otros medios (no pasan por caja)</th><th class="d">Monto</th></tr></thead><tbody>${Object.keys(c.otros).map(k => `<tr><td>${k}</td><td class="d">${pesos(c.otros[k])}</td></tr>`).join('')}</tbody></table>` : ''}
    ${ci.nota ? `<p class="imp-nota">Nota: ${esc(ci.nota)}</p>` : ''}<div class="imp-firmas"><span>Firma de quien cierra</span><span>Firma de control</span></div>`);
}
function imprimirPlanillaInventario(){
  const cat = EST_INV.cat, lista = D().productos.filter(p => !cat || p.cat === cat).sort((a, b) => a.nombre.localeCompare(b.nombre));
  imprimir('INVENTARIO FÍSICO', (cat || 'Todo el stock') + ' · ' + lista.length + ' productos',
    `<table class="imp-t"><thead><tr><th>Código</th><th>Producto</th><th>Unidad</th><th class="d">Contado</th></tr></thead>
      <tbody>${lista.map(p => `<tr><td>${p.cod}</td><td>${esc(p.nombre)}</td><td>${UNIDADES[p.unidad].t}</td><td class="d">__________</td></tr>`).join('')}</tbody></table>`);
}
// Liquidación de la comisión de Lucas: base sin IVA, tramo y % aplicado, y el detalle venta por venta.
function imprimirLiquidacion(id){
  const l = D().liquidaciones.find(x => x.id === id); if (!l) return;
  const mes = mesDeLiq(l), r = comisionMes(mes), f = D().func, iva = l.ivaPct != null ? l.ivaPct : D().config.iva;
  const ventas = r.ventas.slice().sort((a, b) => (fechaCobro(a) || a.f).localeCompare(fechaCobro(b) || b.f));
  const fila = (t, v, cls) => `<tr class="${cls || ''}"><td>${t}</td><td class="d">${v}</td></tr>`;
  const escala = escalaComision().map((t, i) => textoTramo(escalaComision(), i).toLowerCase() + ' → ' + pct(t.pct)).join(' · ');
  imprimir('LIQUIDACIÓN DE COMISIÓN', fMes(mes + '-01') + ' · ' + esc(f.nombre),
    `<div class="imp-para"><small>Vendedor</small><b>${esc(f.nombre)}</b><span>C.I. ${esc(f.ci)} · ${esc(f.cargo)} · liquidada el ${fCorta(l.f)}${l.pagada ? ' · pagada el ' + fCorta(l.fPago) : ' · a pagar'}</span></div>
    <table class="imp-t imp-caja"><tbody>
      ${fila('Total cobrado con IVA (' + ventas.length + ' ventas)', pesos2(r.con))}
      ${fila('− IVA (' + pct(iva) + ')', pesos2(r.iva))}
      ${fila('= Cobrado sin IVA', pesos2(r.sin))}
      ${fila('− Devoluciones (sin IVA)' + (r.aj ? ', con ajustes de meses ya liquidados' : ''), pesos2(r.devSin - r.aj))}
      ${fila('Base del mes (sin IVA)', pesos2(r.base), 'imp-tot')}
      ${fila('Tramo alcanzado', 'Tramo ' + (r.tramo.i + 1) + ' · ' + textoTramo(escalaComision(), r.tramo.i).toLowerCase())}
      ${fila('% aplicado sobre toda la base', pct(r.pct))}
      ${fila('COMISIÓN', pesos2(r.com), 'imp-tot')}</tbody></table>
    <table class="imp-t"><thead><tr><th>Venta</th><th>Cobrada</th><th>Cliente</th><th class="d">Con IVA</th><th class="d">Sin IVA</th><th class="d">Devuelto s/IVA</th><th class="d">Suma</th></tr></thead>
      <tbody>${ventas.map(v => { const c = comisionVenta(v); return `<tr><td>Nº ${v.num}</td><td>${fCorta(fechaCobro(v) || v.f)}</td><td>${esc(nombreCli(v.cli))}</td><td class="d">${pesos2(c.con)}</td><td class="d">${pesos2(c.sin)}</td><td class="d">${c.devSin ? '− ' + pesos2(c.devSin) : ''}</td><td class="d">${pesos2(c.base)}</td></tr>`; }).join('')}
        ${r.ajustes.map(a => `<tr><td colspan="6">Ajuste · ${esc(a.nota)} (${fCorta(a.f)})</td><td class="d">${pesos2(a.base)}</td></tr>`).join('')}</tbody></table>
    <p class="imp-nota">Comisión por escala mensual sobre las ventas cobradas en el mes, sin IVA (importe ÷ ${fmtDec.format(1 + iva / 100)}) y menos devoluciones. Escala: ${escala}; el % se aplica sobre toda la base del mes. La comisión es salario y lleva aportes al BPS.</p>
    <div class="imp-firmas"><span>Firma de ${esc(USUARIOS[VENDEDOR].nombre)}</span><span>Firma de la empresa</span></div>`);
}

function abrirApp(){
  const app = $('#app');
  app.classList.remove('hidden'); app.classList.add('entrando');
  setTimeout(() => app.classList.remove('entrando'), 700);
  pintarUsuario();
  ir(location.hash.slice(1) || 'inicio', true);
}
window.addEventListener('hashchange', () => { if (PERFIL && !$('#app').classList.contains('hidden')) ir(location.hash.slice(1), true); });
document.addEventListener('keydown', e => {
  if (e.key === 'F2' && PERFIL){ e.preventDefault(); nuevaVenta(); return; }   // atajo: F2 = nueva venta
  if (e.key !== 'Escape') return;
  if (!$('#dialogo').classList.contains('hidden')) $('#dlg-no').click();
  else if (modalAbierto()) cerrarModal();
  else { cerrarMenu(); cerrarCampana(); cerrarBusqueda(); }
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') cerrarModal(); });
window.addEventListener('afterprint', () => { $('#impresion').innerHTML = ''; });

Store.cargar();
$('#favicon').href = LOGO_YEDECO_CHICO;   // el hexágono de Yedeco como ícono de la pestaña
armarLateral();
prepararBuscador();
// Desde la página comercial de Wydan (link con ?web=1) se entra directo al ingreso, sin la presentación.
// El link que se le manda a cada cliente (sin ?web=1) abre con la presentación de Wydan.

if (DESDE_WEB){ document.body.classList.add('modo-web'); mostrarBloqueo(); } else mostrarBienvenida();
