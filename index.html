const proveedor = id => mapa('proveedores')[id] || D().proveedores.find(x => x.id === id);
const venta     = id => mapa('ventas')[id] || D().ventas.find(x => x.id === id);
function nombreCli(id){ const c = cliente(id); return c ? c.nombre : 'Consumidor final'; }
function nombreProv(id){ const p = proveedor(id); return p ? p.nombre : '—'; }
function unidadCorta(p){ return (UNIDADES[p.unidad] || UNIDADES.unidad).c; }
function pasoDe(p){ return (UNIDADES[p.unidad] || UNIDADES.unidad).paso; }
function margenDe(p){ return p.precio > 0 ? (p.precio - p.costo) / p.precio * 100 : 0; }

/* =====================================================================
   STOCK
   - Stock actual: lo que hay físicamente en el local.
   - Reservado: vendido y pagado pero todavía no entregado (envíos y acopios).
   - Disponible = actual − reservado.
   - Productos con vencimiento: por LOTE; al sacar, primero el que vence antes.
   ===================================================================== */
function stockDe(p){ return p.vence ? r2(p.lotes.reduce((s, l) => s + l.c, 0)) : p.stock; }
function reservados(){
  return memo('reservados', () => {
    const r = {};
    D().ventas.forEach(v => { if (v.est === 'anulada') return; v.it.forEach(i => { const pend = r2(i.c - i.e); if (pend > 0) r[i.p] = r2((r[i.p] || 0) + pend); }); });
    return r;
  });
}
const reservadoDe = pid => reservados()[pid] || 0;
const disponibleDe = p => r2(stockDe(p) - reservadoDe(p.id));
function lotesOrdenados(p){ return p.lotes.slice().sort((a, b) => (a.vence || '9999').localeCompare(b.vence || '9999')); }

function movStock(pid, c, motivo, ref, lote){
  D().mstock.unshift({ id:Store.id('ms'), f:hoy(), h:hora(), p:pid, c:r2(c), m:motivo, ref:ref || '', u:usuarioTxt(), lote:lote || '' });
}
function sacarStock(pid, cantidad, motivo, ref){
  const p = producto(pid); cantidad = r2(cantidad);
  if (!p || cantidad <= 0) return;
  if (!p.vence){ p.stock = r2(p.stock - cantidad); movStock(pid, -cantidad, motivo, ref); return; }
  let resta = cantidad; const usados = [];
  lotesOrdenados(p).forEach(l => {
    if (resta <= 0 || l.c <= 0) return;
    const q = Math.min(l.c, resta); l.c = r2(l.c - q); resta = r2(resta - q); usados.push(l.lote);
  });
  if (resta > 0){   // se vendió más de lo que había: queda en negativo "sin lote" hasta que entre mercadería
    let sl = p.lotes.find(l => l.lote === 'S/L');
    if (!sl){ sl = { id:Store.id('l'), lote:'S/L', c:0, vence:null }; p.lotes.push(sl); }
    sl.c = r2(sl.c - resta); usados.push('S/L');
  }
  p.lotes = p.lotes.filter(l => l.c !== 0);
  movStock(pid, -cantidad, motivo, ref, usados.join(', '));
}
function entrarStock(pid, cantidad, motivo, ref, lote, vence){
  const p = producto(pid); cantidad = r2(cantidad);
  if (!p || cantidad <= 0) return;
  if (!p.vence){ p.stock = r2(p.stock + cantidad); movStock(pid, cantidad, motivo, ref); return; }
  let q = cantidad;
  const neg = p.lotes.find(l => l.c < 0);
  if (neg){ const cub = Math.min(-neg.c, q); neg.c = r2(neg.c + cub); q = r2(q - cub); }
  if (q > 0){
    if (!lote){   // devolución o corrección sin lote: vuelve al lote que vence antes
      const prim = lotesOrdenados(p).find(l => l.c > 0);
      if (prim){ prim.c = r2(prim.c + q); lote = prim.lote; }
      else p.lotes.push({ id:Store.id('l'), lote:(lote = 'S/L'), c:q, vence:null });
    } else {
      const ex = p.lotes.find(l => l.lote === lote && (l.vence || '') === (vence || ''));
      if (ex) ex.c = r2(ex.c + q); else p.lotes.push({ id:Store.id('l'), lote, c:q, vence:vence || null });
    }
  }
  p.lotes = p.lotes.filter(l => l.c !== 0);
  movStock(pid, cantidad, motivo, ref, lote);
}

/* ---------- Estado de cada producto ---------- */
const ESTADOS_PROD = {
  normal:  { t:'Normal',           c:'c-verde' },
  bajo:    { t:'Bajo mínimo',      c:'c-amarillo' },
  falta:   { t:'En falta',         c:'c-rojo' },
  sinmov:  { t:'Sin movimiento',   c:'c-gris' },
  proximo: { t:'Próximo a vencer', c:'c-amarillo' },
  vencido: { t:'Vencido',          c:'c-rojo' }
};
function indiceVentas(){
  return memo('iv', () => {
    const m = {}, mes = mesClave(hoy());
    D().ventas.forEach(v => {
      if (v.est === 'anulada') return;
      const f = factorDesc(v);
      v.it.forEach(i => {
        const x = m[i.p] || (m[i.p] = { ult:null, cantMes:0, montoMes:0 });
        if (!x.ult || v.f > x.ult) x.ult = v.f;
        if (mesClave(v.f) === mes){ x.cantMes = r2(x.cantMes + i.c - i.d); x.montoMes += (i.c - i.d) * i.pr * f; }
      });
    });
    return m;
  });
}
function info(p){
  return memo('inf_' + p.id, () => {
    const h = hoy(), cfg = D().config;
    const st = stockDe(p), res = reservadoDe(p.id), disp = r2(st - res);
    const iv = indiceVentas()[p.id] || {};
    let vencidos = 0, prox30 = 0, prox60 = 0, proxVence = null;
    if (p.vence) p.lotes.forEach(l => {
      if (l.c <= 0 || !l.vence) return;
      const d = difDias(h, l.vence);
      if (d < 0) vencidos = r2(vencidos + l.c);
      else { if (d <= 30) prox30 = r2(prox30 + l.c); else if (d <= cfg.diasVence) prox60 = r2(prox60 + l.c);
             if (!proxVence || l.vence < proxVence) proxVence = l.vence; }
    });
    const ult = iv.ult || null;
    const diasSin = difDias(ult || p.alta, h);
    const estados = [];
    if (disp <= 0) estados.push('falta'); else if (disp <= p.min) estados.push('bajo');
    if (vencidos > 0) estados.push('vencido');
    if (prox30 + prox60 > 0) estados.push('proximo');
    if (st > 0 && diasSin >= cfg.diasSinVentas) estados.push('sinmov');
    return { st, res, disp, vencidos, prox30, prox60, proxVence, ult, diasSin, estados, estado: estados[0] || 'normal',
             vendMes: iv.cantMes || 0, montoMes: iv.montoMes || 0 };
  });
}
function chipEstadoProd(e){ const x = ESTADOS_PROD[e]; return `<span class="chip ${x.c}">${x.t}</span>`; }
function chipsProd(p){ const i = info(p); return i.estados.length ? i.estados.map(chipEstadoProd).join(' ') : chipEstadoProd('normal'); }
function valorStock(){
  return memo('valor', () => {
    let costo = 0, venta = 0;
    D().productos.forEach(p => { const s = Math.max(0, stockDe(p)); costo += s * p.costo; venta += s * p.precio; });
    return { costo, venta };
  });
}
function inmovilizado(){   // plata parada en productos sin ventas en X días (a costo)
  return memo('inmov', () => {
    const lista = D().productos.filter(p => info(p).estados.includes('sinmov'));
    return { lista, monto: lista.reduce((s, p) => s + Math.max(0, stockDe(p)) * p.costo, 0) };
  });
}

/* =====================================================================
   VENTAS
   Cada renglón: { p: producto, n: nombre, c: cantidad, pr: precio, co: costo,
                   e: cantidad ya entregada, d: cantidad devuelta }
   ===================================================================== */
function factorDesc(v){ return v.sub > 0 ? (v.sub - v.desc) / v.sub : 1; }
function montoDevuelto(v){ return (v.devs || []).reduce((s, d) => s + d.monto, 0); }
function netoVenta(v){ return v.est === 'anulada' ? 0 : v.tot - montoDevuelto(v); }
function costoVenta(v){ return v.est === 'anulada' ? 0 : v.it.reduce((s, i) => s + (i.c - i.d) * i.co, 0); }
const ventaActiva = v => v.est !== 'anulada';
const pendienteFactura = v => ventaActiva(v) && !v.fac;
function pendienteEntrega(v){ return ventaActiva(v) && v.it.some(i => i.c - i.e > 0); }
function chipsVenta(v){
  if (v.est === 'anulada') return '<span class="chip c-gris">Anulada</span>';
  let s = v.fac ? `<span class="chip c-verde">${esc(v.fac.t)} ${esc(v.fac.n)}</span>` : '<span class="chip chip-fac">Pendiente de factura</span>';
  if ((v.devs || []).length) s += ' <span class="chip c-naranja">Con devolución</span>';
  if (v.aco) s += ' <span class="chip c-azul sin-punto">Acopio</span>';
  return s;
}
function vendedorTxt(v){ return (USUARIOS[v.vend] || { nombre:'—' }).nombre; }
const esDeLucas = v => v.vend === VENDEDOR;   // las ventas de Lucas suman a su comisión
function nuevoNumero(tipo){ D().nums[tipo] = (D().nums[tipo] || 0) + 1; return D().nums[tipo]; }

/* ---------- Cuentas corrientes de clientes ---------- */
// Los pagos se aplican a las ventas a cuenta más viejas. Una venta está "cobrada" cuando quedó cubierta,
// y la fecha de cobro es la del pago que la terminó de cubrir (para la comisión de Lucas).
function ccIndice(){
  return memo('cc', () => {
    const r = { porCli:{}, cobradas:new Set(), fCobro:{} };
    D().clientes.forEach(c => r.porCli[c.id] = { deuda:0, pagado:0, saldo:0, ventas:[], cobros:[] });
    D().ventas.forEach(v => { if (v.pago === 'Cuenta corriente' && ventaActiva(v) && r.porCli[v.cli]){ r.porCli[v.cli].deuda += netoVenta(v); r.porCli[v.cli].ventas.push(v); } });
    D().cobros.forEach(c => { if (r.porCli[c.cli]){ r.porCli[c.cli].pagado += c.monto; r.porCli[c.cli].cobros.push(c); } });
    Object.keys(r.porCli).forEach(id => {
      const x = r.porCli[id]; x.saldo = x.deuda - x.pagado;
      const cobros = x.cobros.sort((a, b) => a.f.localeCompare(b.f));
      let queda = 0, k = 0, fUlt = null;
      x.ventas.sort((a, b) => (a.f + a.h).localeCompare(b.f + b.h)).forEach(v => {
        const n = netoVenta(v);
        while (queda >= 0 && queda < n - .5 && k < cobros.length){ queda += cobros[k].monto; fUlt = cobros[k].f; k++; }
        if (queda >= n - .5){ r.cobradas.add(v.id); r.fCobro[v.id] = fUlt && fUlt > v.f ? fUlt : v.f; queda -= n; } else queda = -1e12;
      });
    });
    return r;
  });
}
const saldoCliente = id => (ccIndice().porCli[id] || { saldo:0 }).saldo;
const ventaCobrada = v => v.pago !== 'Cuenta corriente' || ccIndice().cobradas.has(v.id);
// Día en que la venta quedó cobrada (contado: el día de la venta; cuenta corriente: el día del pago que la cubrió).
const fechaCobro = v => v.pago !== 'Cuenta corriente' ? v.f : (ccIndice().fCobro[v.id] || null);
function ultimaCompraCli(id){ return memo('ucli', () => { const m = {}; D().ventas.forEach(v => { if (v.cli && ventaActiva(v) && (!m[v.cli] || v.f > m[v.cli])) m[v.cli] = v.f; }); return m; })[id] || null; }

/* ---------- Proveedores y cuentas a pagar ---------- */
function cpIndice(){
  return memo('cp', () => {
    const r = {};
    D().proveedores.forEach(p => r[p.id] = { comprado:0, pagado:0, saldo:0, pendientes:[] });
    D().compras.forEach(c => { if (r[c.prov]) r[c.prov].comprado += c.tot; });
    D().dinero.forEach(m => { if (m.tipo === 'pagoProv' && r[m.prov]) r[m.prov].pagado += m.monto; });
    Object.keys(r).forEach(id => {
      const x = r[id]; x.saldo = x.comprado - x.pagado;
      let queda = x.pagado;
      D().compras.filter(c => c.prov === id).sort((a, b) => a.f.localeCompare(b.f)).forEach(c => {
        if (queda >= c.tot - .5){ queda -= c.tot; return; }
        x.pendientes.push({ compra:c, debe:c.tot - Math.max(0, queda) }); queda = 0;
      });
    });
    return r;
  });
}
const saldoProv = id => (cpIndice()[id] || { saldo:0 }).saldo;
function estadoPedido(pd){
  const rec = pd.it.reduce((s, i) => s + i.r, 0);
  if (rec <= 0) return 'pendiente';
  return pd.it.every(i => i.r >= i.c) ? 'recibido' : 'parcial';
}
const ESTADOS_PEDIDO = { pendiente:{ t:'Pendiente', c:'c-amarillo' }, parcial:{ t:'Recibido parcial', c:'c-azul' }, recibido:{ t:'Recibido', c:'c-verde' } };
const ESTADOS_ENTREGA = { pendiente:{ t:'Pendiente', c:'c-amarillo' }, camino:{ t:'En camino', c:'c-azul' }, entregada:{ t:'Entregada', c:'c-verde' } };

/* =====================================================================
   COMISIÓN DE LUCAS · escala mensual sobre lo cobrado SIN IVA
   - Base del mes = ventas de Lucas cobradas en el mes, sin IVA, menos devoluciones (sin IVA).
     Las anuladas no cuentan; las de cuenta corriente cuentan el mes en que se cobran.
   - Sin IVA = importe con IVA ÷ (1 + IVA), redondeado a 2 decimales, venta por venta.
   - El % del tramo alcanzado se aplica sobre TODA la base del mes (no por tramos).
   - Se calcula al liquidar el mes. Si una venta ya liquidada tiene después una devolución
     (o se anula), lo devuelto sin IVA se resta de la base de la liquidación siguiente.
   - Lo que entra (o se ajusta) en un mes que ya se liquidó pasa al mes siguiente.
   ===================================================================== */
const tasaIVA = () => Number(D().config.iva) || 0;
const sinIVA = n => r2(n / (1 + tasaIVA() / 100));
function escalaComision(){ return (D().config.escalaComision || []).slice().sort((a, b) => a.desde - b.desde); }
function tramoComision(base){   // el tramo que corresponde a la base del mes
  const esc = escalaComision(); let k = 0;
  esc.forEach((t, i) => { if (base >= t.desde) k = i; });
  return { i:k, pct:Number((esc[k] || { pct:0 }).pct) || 0, desde:(esc[k] || { desde:0 }).desde, sig:esc[k + 1] || null };
}
// Lo que suma una venta de Lucas a la base de su mes (sin IVA, ya descontado lo devuelto).
function comisionVenta(v){
  if (!esDeLucas(v) || !ventaActiva(v)) return { con:0, sin:0, devCon:0, devSin:0, base:0 };
  const f = factorDesc(v);
  const con = v.it.reduce((s, i) => s + i.c * i.pr * f, 0), devCon = v.it.reduce((s, i) => s + i.d * i.pr * f, 0);
  const sin = sinIVA(con), devSin = sinIVA(devCon);
  return { con, sin, devCon, devSin, base:r2(sin - devSin) };
}
function ventasLiquidadas(){ return memo('liq', () => { const s = new Set(); D().liquidaciones.forEach(l => l.ventas.forEach(id => s.add(id))); return s; }); }
const liquidacionDe = mes => D().liquidaciones.find(l => l.mes === mes || (!l.mes && mesClave(l.desde) === mes));
function mesQueToma(mes){   // si ese mes ya está liquidado, lo nuevo pasa al siguiente
  let m = mes; while (liquidacionDe(m)) m = mesClave(sumarMeses(m + '-01', 1));
  return m;
}
function comisionMes(mes){   // mes = 'AAAA-MM'
  return memo('com_' + mes, () => {
    const liq = liquidacionDe(mes), yaLiq = ventasLiquidadas();
    let ventas, ajustes;
    if (liq){
      const ids = new Set(liq.ventas);
      ventas = D().ventas.filter(v => ids.has(v.id));
      ajustes = D().comAjustes.filter(a => a.liq === liq.id);
    } else {
      ventas = D().ventas.filter(v => { if (!esDeLucas(v) || !ventaActiva(v) || yaLiq.has(v.id)) return false; const fc = fechaCobro(v); return fc && mesQueToma(mesClave(fc)) === mes; });
      ajustes = D().comAjustes.filter(a => !a.liq && mesQueToma(mesClave(a.f)) === mes);
    }
    const sinCobrar = liq ? [] : D().ventas.filter(v => esDeLucas(v) && ventaActiva(v) && !fechaCobro(v) && mesClave(v.f) <= mes);
    let con = 0, sin = 0, devCon = 0, devSin = 0;
    ventas.forEach(v => { const c = comisionVenta(v); con += c.con; sin += c.sin; devCon += c.devCon; devSin += c.devSin; });
    const aj = r2(ajustes.reduce((s, a) => s + a.base, 0));            // ajustes (negativos) de meses ya liquidados
    const base = r2(sin - devSin + aj), tramo = tramoComision(base);
    const r = { mes, liq, ventas, sinCobrar, ajustes, con, iva:r2(con - sin), sin:r2(sin), devCon, devSin:r2(devSin), aj, base, tramo, pct:tramo.pct, com:r2(base * tramo.pct / 100) };
    if (liq){   // lo liquidado queda congelado (lo que pase después va como ajuste al mes siguiente)
      ['con', 'iva', 'sin', 'devSin', 'aj'].forEach(k => { if (liq[k] != null) r[k] = liq[k]; });
      r.base = liq.base; r.pct = liq.pct; r.com = liq.monto; r.tramo = Object.assign(tramoComision(liq.base), { pct:liq.pct });
      if (liq.tramo) r.tramo.i = liq.tramo - 1;
    }
    r.sinCobrarSin = r2(sinCobrar.reduce((s, v) => s + comisionVenta(v).base, 0));
    return r;
  });
}
// Si se devuelve (o se anula) algo de una venta de Lucas que ya estaba liquidada, se descuenta en la liquidación siguiente.
function ajusteComision(v, baseAntes, nota){
  if (!esDeLucas(v) || !ventasLiquidadas().has(v.id)) return;
  const dif = r2(comisionVenta(v).base - baseAntes);
  if (dif) D().comAjustes.push({ id:Store.id('ca'), f:hoy(), venta:v.id, base:dif, nota });
}

/* =====================================================================
   DINERO: gastos, retiros, aportes, pagos a proveedores, cobros y caja
   ===================================================================== */
function nuevoDinero(o){
  const m = Object.assign({ id:Store.id('d'), f:hoy(), h:hora(), medio:'Efectivo', u:usuarioTxt() }, o);
  m.monto = Number(m.monto) || 0; D().dinero.unshift(m); return m;
}
function cajaDelDia(f){
  const c = D().caja[f] || null, ef = x => x === 'Efectivo';
  const ing = [], egr = [];
  const suma = (lista, t, arr, fn) => { const n = lista.reduce((s, x) => s + fn(x), 0); if (lista.length) arr.push({ t, n:lista.length, monto:n }); };
  const vEf = D().ventas.filter(v => v.f === f && ef(v.pago));
  suma(vEf, 'Ventas en efectivo', ing, v => v.tot);
  suma(D().cobros.filter(x => x.f === f && ef(x.medio)), 'Cobros de cuentas corrientes', ing, x => x.monto);
  suma(D().dinero.filter(m => m.f === f && m.tipo === 'aporte' && ef(m.medio)), 'Aportes de capital', ing, m => m.monto);
  const devs = []; D().ventas.forEach(v => { if (ef(v.pago)) (v.devs || []).forEach(d => { if (d.f === f) devs.push(d); }); });
  suma(devs, 'Devoluciones', egr, d => d.monto);
  suma(D().ventas.filter(v => v.anul && v.anul.f === f && ef(v.pago)), 'Ventas anuladas', egr, v => v.tot - montoDevuelto(v));
  ['gasto', 'retiro', 'pagoProv'].forEach(t => suma(D().dinero.filter(m => m.f === f && m.tipo === t && ef(m.medio)), { gasto:'Gastos', retiro:'Retiros de socios', pagoProv:'Pagos a proveedores' }[t], egr, m => m.monto));
  const totIng = ing.reduce((s, x) => s + x.monto, 0), totEg = egr.reduce((s, x) => s + x.monto, 0);
  const ap = c ? c.ap : 0;
  const otros = {}; D().ventas.filter(v => v.f === f && !ef(v.pago)).forEach(v => otros[v.pago] = (otros[v.pago] || 0) + v.tot);
  return { f, abierta: !!c, ap, ing, egr, totIng, totEg, esperado: ap + totIng - totEg, cierre: c && c.cierre, otros };
}
function resultadoMes(mes){   // mes = 'AAAA-MM'
  const ventas = D().ventas.filter(v => ventaActiva(v) && mesClave(v.f) === mes);
  const vendido = ventas.reduce((s, v) => s + netoVenta(v), 0);
  const cmv = ventas.reduce((s, v) => s + costoVenta(v), 0);
  const gastosL = D().dinero.filter(m => m.tipo === 'gasto' && mesClave(m.f) === mes);
  const gastos = gastosL.reduce((s, m) => s + m.monto, 0);
  const porCat = {}; gastosL.forEach(m => porCat[m.cat] = (porCat[m.cat] || 0) + m.monto);
  const ganancia = vendido - cmv - gastos;
  return { mes, n:ventas.length, vendido, cmv, gastos, porCat, ganancia, margen: vendido ? ganancia / vendido * 100 : 0 };
}

/* ---------- Entregas del día / atrasadas ---------- */
function ventasConEntrega(){ return D().ventas.filter(v => v.ent && ventaActiva(v)); }
function entregasPendientesHoy(){ const h = hoy(); return ventasConEntrega().filter(v => v.ent.est !== 'entregada' && v.ent.f <= h); }

    d.presupuestos.push({ id:ID('pp'), num:++d.nums.presupuesto, f:sumarDias(h, dd), cli:cl, nom, tel, it, sub, desc:0, tot:sub, val:d.config.validezPresupuesto, est, venta:null, u:N(u) });
  };
  presu(-20, null, 'Rosa Viera', '099 000 501', [['003', 30], ['004', 24], ['010', 12], ['006', 4], ['002', 3]], 'abierto', 'carolina');
  presu(-5, 'cl2', '', '', [['088', 12], ['222', 10], ['007', 6], ['0569', 2], ['5632', 3]], 'abierto', 'alan');
  presu(-2, null, 'Esteban Rocha', '099 000 502', [['028', 2], ['127', 3], ['129', 3], ['610', 2]], 'abierto', 'lucas');
  presu(0, 'cl5', '', '', [['045', 4], ['5621', 2], ['061', 2], ['124', 20]], 'abierto', 'lucas');

  /* ---- Stock: lo reservado (entregas y acopios pendientes) se suma a lo disponible ---- */
  _cache = {};
  d.productos.forEach(p => {
    const res = reservadoDe(p.id); if (res <= 0) return;
    if (!p.vence) p.stock = r2(p.stock + res);
    else { const l = lotesOrdenados(p).filter(x => x.c > 0).pop(); if (l) l.c = r2(l.c + res); else p.lotes.push({ id:ID('l'), lote:'L-' + R(1000, 9999), c:res, vence:sumarDias(h, 250) }); }
  });
  d.productos.forEach(p => { delete p._peso; delete p._q; });

  /* ---- Caja: los últimos días cerrados, hoy abierta ---- */
  _cache = {};
  const difs = [0, -50, 0, 20, 0, 0, -100, 0, 10, 0, 0, -20];
  for (let dd = -16, k = 0; dd <= 0; dd++){
    const f = sumarDias(h, dd); if (diaSemana(f) === 0) continue;
    const quien = N(k % 2 ? 'alan' : 'carolina');
    d.caja[f] = { ap:5000, apH:'08:00', apU:quien };
    if (dd < 0){ _cache = {}; const c = cajaDelDia(f); d.caja[f].cierre = { contado:c.esperado + difs[k % difs.length], esperado:c.esperado, h:'19:10', u:quien, nota:'' }; }
    k++;
  }

  d.mstock.sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
  d.dinero.sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
  d.cobros.sort((a, b) => b.f.localeCompare(a.f));
  // Registro de actividad (lo de hoy)
  d.ventas.filter(v => v.f === h).forEach(v => d.log.unshift({ f:h, h:v.h, u:v.u, a:'Registró la venta Nº ' + v.num + ' por ' + pesos(v.tot) }));
  d.log.push({ f:h, h:'08:00', u:d.caja[h] ? d.caja[h].apU : N('carolina'), a:'Abrió la caja con ' + pesos(5000) });
  d.log.sort((a, b) => (b.f + b.h).localeCompare(a.f + a.h));
  _cache = {};
  return d;
}

/* =====================================================================
   CAMPANITA: todas las alertas juntas, con número
   ===================================================================== */
// Cada tipo de aviso: k = clave, para poder apagarlo o marcarlo como leído.
const TIPOS_AVISO = [
  { k:'falta',    t:'Productos sin stock' },
  { k:'vencido',  t:'Mercadería vencida' },
  { k:'bajo',     t:'Productos con poco stock' },
  { k:'prox30',   t:'Productos que vencen este mes' },
  { k:'entregas', t:'Entregas para hoy' },
  { k:'pedidos',  t:'Pedidos a proveedores demorados' },
  { k:'factura',  t:'Ventas sin número de factura' },
  { k:'pagar',    t:'Facturas de proveedores para pagar', duenos:true },
  { k:'limite',   t:'Clientes pasados de su límite de crédito', duenos:true },
  { k:'caja',     t:'Caja del día sin abrir', duenos:true }
];
const firmaDe = ids => ids.slice().sort().join(',');
function alertas(){   // TODAS las alertas (sin mirar lo leído ni lo apagado)
  return memo('alertas', () => {
    const a = [], h = hoy(), P = D().productos.map(p => [p, info(p)]);
    const cuenta = e => P.filter(([p, i]) => i.estados.includes(e));
    const ids = l => firmaDe(l.map(x => (x[0] || x).id));
    const falta = cuenta('falta'), bajo = cuenta('bajo'), venc = cuenta('vencido');
    const prox30 = P.filter(([p, i]) => i.prox30 > 0);
    if (falta.length) a.push({ k:'falta', firma:ids(falta), n:falta.length, t:'Productos en falta', nivel:'rojo', sec:'stock', ir:"verStock('falta')" });
    if (venc.length) a.push({ k:'vencido', firma:ids(venc), n:venc.length, t:'Productos con lotes vencidos', nivel:'rojo', sec:'stock', ir:"verStock('vencido')" });
    if (bajo.length) a.push({ k:'bajo', firma:ids(bajo), n:bajo.length, t:'Productos bajo el mínimo', nivel:'amarillo', sec:'stock', ir:"verStock('bajo')" });
    if (prox30.length) a.push({ k:'prox30', firma:ids(prox30), n:prox30.length, t:'Vencen en los próximos 30 días', nivel:'amarillo', sec:'stock', ir:"verStock('proximo')" });
    const ent = entregasPendientesHoy(), atr = ent.filter(v => v.ent.f < h);
    if (ent.length) a.push({ k:'entregas', firma:h + ':' + ids(ent), n:ent.length, t:'Entregas para hoy sin terminar', nivel: atr.length ? 'rojo' : 'azul', sec:'entregas', ir:"ir('entregas')" });
    const pedAtr = D().pedidos.filter(pd => estadoPedido(pd) !== 'recibido' && difDias(pd.f, h) > 5);
    if (pedAtr.length) a.push({ k:'pedidos', firma:ids(pedAtr), n:pedAtr.length, t:'Pedidos a proveedores demorados', nivel:'amarillo', sec:'compras', ir:"verCompras('pedidos')" });
    // Ventas sin número de factura: los dueños ven todas; Lucas, las que vendió o registró él.
    const pf = D().ventas.filter(v => pendienteFactura(v) && (esDueno() || v.vend === PERFIL || v.u === usuarioTxt()));
    if (pf.length) a.push({ k:'factura', firma:ids(pf), n:pf.length, t: esDueno() ? 'Ventas pendientes de factura' : 'Tus ventas sin número de factura', nivel:'amarillo', sec:'vender', ir: esDueno() ? "verVentas('pendiente')" : "verVentas('mias')" });
    if (esDueno()){
      const pagar = []; Object.values(cpIndice()).forEach(x => x.pendientes.forEach(p => { if (p.compra.venc && difDias(h, p.compra.venc) <= 7) pagar.push(p.compra); }));
      if (pagar.length) a.push({ k:'pagar', firma:ids(pagar), n:pagar.length, t:'Facturas de proveedores por pagar', nivel: pagar.some(c => c.venc < h) ? 'rojo' : 'amarillo', sec:'finanzas', ir:"verFinanzas('cuentas')" });
      const sobre = D().clientes.filter(c => c.limite > 0 && saldoCliente(c.id) > c.limite);
      if (sobre.length) a.push({ k:'limite', firma:ids(sobre), n:sobre.length, t:'Clientes por encima de su límite', nivel:'rojo', sec:'clientes', ir:"verClientes('limite')" });
      if (!D().caja[h] && diaSemana(h) !== 0) a.push({ k:'caja', firma:h, n:1, t:'La caja de hoy no está abierta', nivel:'azul', sec:'finanzas', ir:"verFinanzas('caja')" });
    }
    return a;
  });
}
/* Lo que elige cada usuario: qué avisos quiere y cuáles ya leyó.
   Un aviso leído vuelve a aparecer solo si cambia (por ejemplo, otro producto se queda sin stock). */
function prefsAvisos(){
  const d = D(); d.avisos = d.avisos || {};
  return d.avisos[PERFIL] || (d.avisos[PERFIL] = { apagados:{}, leidos:{} });
}
const avisoLeido = x => prefsAvisos().leidos[x.k] === x.firma;
const avisoApagado = x => !!prefsAvisos().apagados[x.k];
function avisosActivos(){ return alertas().filter(x => !avisoApagado(x) && !avisoLeido(x)); }
let _verLeidos = false;
function alternarCampana(){ const p = $('#campana-panel'); if (p.classList.contains('hidden')) abrirCampana(); else cerrarCampana(); }
function abrirCampana(){
  const activos = avisosActivos(), leidos = alertas().filter(x => !avisoApagado(x) && avisoLeido(x));
  const item = (x, leido) => `<div class="cp-it ${leido ? 'leido' : ''}"><button class="cp-ir" onclick="cerrarCampana(); ${x.ir}"><span class="cp-n chip-${x.nivel}">${x.n}</span><b>${fraseAviso(x)}</b></button>
    <button class="cp-leer" onclick="event.stopPropagation(); marcarAviso('${x.k}', ${!leido})" title="${leido ? 'Volver a mostrar' : 'Marcar como leída'}" aria-label="${leido ? 'Volver a mostrar' : 'Marcar como leída'}">${ico(leido ? 'volver' : 'ok')}</button></div>`;
  $('#campana-panel').innerHTML = `<div class="cp-cab"><span>Avisos</span><button class="link" onclick="event.stopPropagation(); configurarAvisos()">${ico('config')} Elegir avisos</button></div>`
    + (activos.length ? activos.map(x => item(x, false)).join('') : vacio('No tenés avisos nuevos.'))
    + (activos.length > 1 ? `<button class="cp-pie link" onclick="event.stopPropagation(); marcarTodos()">${ico('ok')} Marcar todos como leídos</button>` : '')
    + (leidos.length ? `<button class="cp-pie link" onclick="event.stopPropagation(); _verLeidos = !_verLeidos; abrirCampana()">${_verLeidos ? 'Ocultar' : 'Ver'} los leídos (${leidos.length})</button>` + (_verLeidos ? leidos.map(x => item(x, true)).join('') : '') : '');
  $('#campana-panel').classList.remove('hidden');
}
function despuesDeAvisos(){ guardar(); pintarNav(); if (seccionActual === 'inicio') RENDER.inicio(); }
function marcarAviso(k, leido){
  const x = alertas().find(a => a.k === k), p = prefsAvisos();
  if (leido && x) p.leidos[k] = x.firma; else delete p.leidos[k];
  despuesDeAvisos(); abrirCampana();
}
function marcarTodos(){ const p = prefsAvisos(); avisosActivos().forEach(x => p.leidos[x.k] = x.firma); despuesDeAvisos(); abrirCampana(); }
function prenderAviso(k, si){ prefsAvisos().apagados[k] = !si; despuesDeAvisos(); }
function configurarAvisos(){
  cerrarCampana();
  const p = prefsAvisos(), tipos = TIPOS_AVISO.filter(t => !t.duenos || esDueno());
  abrirModal({ titulo:'Elegir avisos', sub:'Marcá lo que querés que te avise la campanita', ancho:'modal-sm', foco:false,
    cuerpo:`<div class="lista">${tipos.map(t => `<label class="fila-lista conf-aviso"><span>${t.t}</span>
      <span class="interruptor"><input type="checkbox" ${p.apagados[t.k] ? '' : 'checked'} onchange="prenderAviso('${t.k}', this.checked)"></span></label>`).join('')}</div>
      <p class="muted chico mt-s">Lo que apagues deja de aparecer en la campanita y en «Para atender». La información sigue estando en cada sección.</p>`,
    pie:`<button class="btn btn-azul" onclick="cerrarModal()">Listo</button>` });
}
function cerrarCampana(){ const p = $('#campana-panel'); if (p) p.classList.add('hidden'); }
document.addEventListener('click', e => { if (!e.target.closest('.campana-caja')) cerrarCampana(); if (!e.target.closest('.buscador') && !e.target.closest('#btn-busq-movil')) cerrarBusqueda(); });

/* =====================================================================
   BUSCADOR GENERAL (nombre, código, código de barras, RUT o Nº de venta)
   ===================================================================== */
let _busqSel = 0;
function resultadosBusqueda(q){
  q = sinTildes(q.trim()); if (q.length < 2) return [];
  const r = [], n = q.replace(/\s/g, '');
  D().productos.filter(p => sinTildes(p.nombre + ' ' + p.cod + ' ' + p.marca).includes(q) || p.barras === n || sinTildes(p.cod) === n).slice(0, 7)
    .forEach(p => r.push({ g:'Productos', t:p.nombre, s:p.cod + ' · disp. ' + cant(disponibleDe(p)) + ' ' + unidadCorta(p), fn:`fichaProducto('${p.id}')` }));
  D().clientes.filter(c => sinTildes(c.nombre + ' ' + c.doc).includes(q) || c.doc.replace(/\D/g, '').includes(n.replace(/\D/g, '') || 'x')).slice(0, 5)
    .forEach(c => r.push({ g:'Clientes', t:c.nombre, s:c.tdoc + ' ' + c.doc, fn:`fichaCliente('${c.id}')` }));
  D().proveedores.filter(p => sinTildes(p.nombre + ' ' + p.rut).includes(q) || p.rut.replace(/\D/g, '').includes(n.replace(/\D/g, '') || 'x')).slice(0, 4)
    .forEach(p => r.push({ g:'Proveedores', t:p.nombre, s:'RUT ' + p.rut, fn:`fichaProveedor('${p.id}')` }));
  const num = Number(q.replace(/[^\d]/g, ''));
  if (num){ const v = D().ventas.find(x => x.num === num); if (v) r.push({ g:'Ventas', t:'Venta Nº ' + v.num, s:fCorta(v.f) + ' · ' + pesos(v.tot) + ' · ' + nombreCli(v.cli), fn:`fichaVenta('${v.id}')` }); }
  return r;
}
function pintarBusqueda(){
  const q = $('#busq-global').value, r = resultadosBusqueda(q), caja = $('#busq-res');
  if (q.trim().length < 2){ caja.classList.add('hidden'); return; }
  let g = '';
  caja.innerHTML = r.length ? r.map((x, i) => (x.g !== g ? `<div class="busq-grupo">${(g = x.g)}</div>` : '') +
    `<button class="busq-it ${i === _busqSel ? 'sel' : ''}" onclick="cerrarBusqueda(); ${x.fn}"><span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`).join('')
    : `<div class="vacio">No se encontró «${esc(q)}»</div>`;
  caja.classList.remove('hidden');
}
function cerrarBusqueda(){ const c = $('#busq-res'); if (c) c.classList.add('hidden'); document.body.classList.remove('busq-movil'); }
function abrirBusquedaMovil(){ document.body.classList.add('busq-movil'); setTimeout(() => $('#busq-global').focus(), 30); }
function prepararBuscador(){
  const i = $('#busq-global');
  i.addEventListener('input', () => { _busqSel = 0; pintarBusqueda(); });
  i.addEventListener('focus', pintarBusqueda);
  i.addEventListener('keydown', e => {
    const r = resultadosBusqueda(i.value);
    if (e.key === 'ArrowDown'){ _busqSel = Math.min(r.length - 1, _busqSel + 1); pintarBusqueda(); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ _busqSel = Math.max(0, _busqSel - 1); pintarBusqueda(); e.preventDefault(); }
    else if (e.key === 'Enter' && r[_busqSel]){ e.preventDefault(); const fn = r[_busqSel].fn; i.value = ''; cerrarBusqueda(); i.blur(); new Function(fn)(); }
    else if (e.key === 'Escape'){ i.value = ''; cerrarBusqueda(); i.blur(); }
  });
}


/* ===== js/07-inicio.js ===== */
/* =====================================================================
   INICIO · simple a propósito: pocos números, lo que hay que atender
   y las ventas de hoy. El detalle está en cada sección.
   - Lucas (vendedor): sus ventas del día y lo que hay que atender (stock y entregas).
   - Carolina y Alan (dueños): además la caja y lo vendido en el mes.
   ===================================================================== */
RENDER.inicio = function(){
  const h = hoy(), dueno = esDueno();
  const hoyV = D().ventas.filter(v => v.f === h && ventaActiva(v));
  const mias = dueno ? hoyV : hoyV.filter(v => v.vend === PERFIL);
  const totHoy = mias.reduce((s, v) => s + netoVenta(v), 0);
  const ent = entregasPendientesHoy();

  encabezado(saludo() + ', ' + USUARIOS[PERFIL].nombre, '¿Qué querés hacer?', '');

  const atajo = (icono, t, sub, fn, cls) => `<button class="atajo ${cls || ''}" onclick="${fn}">${ico(icono)}<span><b>${t}</b><small>${sub}</small></span></button>`;
  let html = `<div class="atajos">
    ${atajo('vender', 'Vender', 'Cobrar una venta', 'nuevaVenta()', 'destacado')}
    ${atajo('buscar', 'Consultar stock', 'Ver cuánto hay y precios', "verStock('todos')")}
    ${atajo('camion', 'Entregas', ent.length ? ent.length + ' para hoy' : 'Nada para hoy', "ir('entregas')")}
  </div>`;

  const numero = (t, v, sub) => `<div class="numero"><small>${t}</small><b class="num">${v}</b><span>${sub}</span></div>`;
  if (dueno){
    const caja = cajaDelDia(h), mes = resultadoMes(mesClave(h));
    html += `<div class="numeros">${numero('Vendido hoy', pesos(totHoy), mias.length + ' venta' + (mias.length === 1 ? '' : 's'))}
      ${numero('En la caja', caja.abierta ? pesos(caja.esperado) : '—', caja.abierta ? 'efectivo' : 'sin abrir')}
      ${numero('Vendido en ' + MESES[aFecha(h).getMonth()], pesos(mes.vendido), mes.n + ' ventas')}</div>`;
  } else {
    html += `<div class="numeros">${numero('Vendiste hoy', pesos(totHoy), mias.length + ' venta' + (mias.length === 1 ? '' : 's'))}</div>`;
  }

  // Lo que hay que atender: las mismas alertas de la campanita, dichas en palabras simples (máximo 5)
  const a = avisosActivos().slice(0, 5);
  html += `<div class="grid g-2 mt">
    <div class="card"><div class="card-cab"><div class="card-t">Para atender</div></div>
      ${a.length ? `<div class="lista">${a.map(x => `<button class="fila-lista atender" onclick="${x.ir}"><span class="punto p-${x.nivel}"></span>
        <span class="at-t">${fraseAviso(x)}</span><span class="link">Ver ${ico('der')}</span></button>`).join('')}</div>` : vacio('Todo en orden. No hay nada pendiente.')}</div>
    <div class="card"><div class="card-cab"><div class="card-t">${dueno ? 'Ventas de hoy' : 'Tus ventas de hoy'}</div>${mias.length ? `<a class="link" onclick="verVentas('hoy')">Ver todas ${ico('der')}</a>` : ''}</div>
      ${mias.length ? `<div class="lista">${mias.slice().reverse().slice(0, 5).map(filaVentaCorta).join('')}</div>` : vacio('Todavía no hay ventas hoy.')}</div>
  </div>`;
  $('#vista').innerHTML = html;
};

// Cada aviso en una frase corta y clara
function fraseAviso(x){
  const n = x.n, s = n === 1 ? '' : 's';
  const frases = {
    'Productos en falta': `${n} producto${s} sin stock`,
    'Productos con lotes vencidos': `${n} producto${s} con mercadería vencida`,
    'Productos bajo el mínimo': `${n} producto${s} con poco stock`,
    'Vencen en los próximos 30 días': `${n} producto${s} vence${n === 1 ? '' : 'n'} este mes`,
    'Entregas para hoy sin terminar': `${n} entrega${s} para hoy`,
    'Pedidos a proveedores demorados': `${n} pedido${s} a proveedores demorado${s}`,
    'Ventas pendientes de factura': `${n} venta${s} sin factura`,
    'Tus ventas sin número de factura': `${n} venta${s} tuya${s} sin número de factura`,
    'Facturas de proveedores por pagar': `${n} factura${s} de proveedores para pagar esta semana`,
    'Clientes por encima de su límite': `${n} cliente${s} pasado${s} de su límite de crédito`,
    'La caja de hoy no está abierta': 'La caja de hoy no está abierta'
  };
  return frases[x.t] || (n + ' · ' + x.t);
}

function filaVentaCorta(v){
  return `<button class="fila-lista" onclick="fichaVenta('${v.id}')">
    <span><span class="p-nombre">${esc(nombreCli(v.cli))}</span><span class="p-cod">${v.h} · ${v.pago}${v.fac ? '' : ' · <b class="am">sin factura</b>'}</span></span>
    <b class="num">${pesos(netoVenta(v))}</b></button>`;
}


/* ===== js/08-vender.js ===== */
/* =====================================================================
   VENDER · mostrador
   Buscar por nombre o código, o escanear (el lector USB escribe como un
   teclado y termina con Enter). Al confirmar, el stock se descuenta solo.

const EST_VENDER = { tab:'mostrador' };
let CARRO = { it:[], cli:null, descTipo:'%', descVal:0, pre:null };
let _qPos = '';

RENDER.vender = function(){
  const t = EST_VENDER.tab;
  document.body.classList.toggle('en-pos', t === 'mostrador');
  const nPend = D().ventas.filter(pendienteFactura).length;
  const nPre = D().presupuestos.filter(p => estadoPresupuesto(p) === 'abierto').length;
  const nAco = D().ventas.filter(v => v.aco && pendienteEntrega(v)).length;
  encabezado('Vender', t === 'mostrador' ? 'Buscá el producto o escaneá el código de barras.' : '',
    t === 'mostrador' ? `<button class="btn btn-linea" onclick="nuevoPresupuesto()">${ico('presupuesto')} Nuevo presupuesto</button>`

  $('#vista').innerHTML = html + '<div id="vender-cuerpo"></div>';
  if (t === 'mostrador') pintarMostrador();
  else if (t === 'ventas') pintarListaVentas();
  else if (t === 'presupuestos') pintarPresupuestos();
  else pintarAcopios();
};
function tabVender(t){ EST_VENDER.tab = t; RENDER.vender(); }
async function nuevaVenta(){
  cerrarMenu();
  if (CARRO.it.length){
    const seguir = await confirmar('Hay una venta sin terminar', `Tiene ${CARRO.it.length} producto${CARRO.it.length > 1 ? 's' : ''} cargado${CARRO.it.length > 1 ? 's' : ''}. ¿Querés seguir con esa o empezar una nueva?`, 'Seguir con esa');
    if (!seguir) vaciarCarro(true);
  }

/* ---------- Pantalla del mostrador ---------- */
function pintarMostrador(){
  $('#vender-cuerpo').innerHTML = `<div class="pos-caja">
    <div class="pos-izq">
      <div class="pos-busca">${ico('barras')}<input id="pos-buscar" type="search" autocomplete="off" placeholder="Nombre, código o escaneá el código de barras" value="${esc(_qPos)}"
        aria-label="Buscar producto"></div>
      <div id="pos-res"></div>
    </div>
    <div class="pos-der"><div class="ticket" id="ticket"></div></div>
  </div>
  <div class="pos-barra" id="pos-barra"></div>`;
  const i = $('#pos-buscar');
  i.addEventListener('input', () => { _qPos = i.value; pintarResultadosPos(); });
  i.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); enterPos(); } });
  pintarResultadosPos(); pintarTicket();
  if (window.innerWidth > 900) setTimeout(() => i.focus(), 50);
}
function buscarProductos(q){
  q = sinTildes(q.trim()); if (!q) return [];
  const pal = q.split(/\s+/);
  return D().productos.filter(p => { const t = sinTildes(p.nombre + ' ' + p.cod + ' ' + p.marca + ' ' + p.cat + ' ' + p.barras); return pal.every(w => t.includes(w)); }).slice(0, 30);
}
function pintarResultadosPos(){
  const q = _qPos.trim(), caja = $('#pos-res'); if (!caja) return;
  const tarjeta = p => { const i = info(p), sinDisp = i.disp <= 0;
    return `<button class="pos-prod ${sinDisp ? 'agotado' : ''}" onclick="agregarAlCarro('${p.id}')">
      <span class="pp-n">${esc(p.nombre)}</span>
      <span class="pp-c">${p.cod}${p.vence ? ' · ' + ico('vence') : ''}</span>
      <span class="pp-pie"><b class="num">${pesos(p.precio)}</b><small class="${sinDisp ? 'neg' : i.disp <= p.min ? 'am' : ''}">${sinDisp ? 'Sin disponible' : 'Disp. ' + cant(i.disp) + ' ' + unidadCorta(p)}</small></span></button>`; };
  if (!q){
    const top = D().productos.map(p => [p, info(p).vendMes]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 12).map(x => x[0]);
    caja.innerHTML = `<div class="pos-sub">${ico('estrella')} Los más vendidos del mes · tocá para agregar</div><div class="pos-grilla">${top.map(tarjeta).join('')}</div>`;
    return;
  }
  const r = buscarProductos(q);
  caja.innerHTML = r.length ? `<div class="pos-sub">${r.length} resultado${r.length > 1 ? 's' : ''} · Enter agrega el primero</div><div class="pos-grilla">${r.map(tarjeta).join('')}</div>`
    : vacio(`No hay productos con «${esc(q)}».` + (esDueno() ? ` <br><button class="btn btn-linea btn-sm mt-s" onclick="formProducto()">${ico('mas')} Crear producto</button>` : ''));
}
function enterPos(){
  const q = _qPos.trim(); if (!q) return;
  const exacto = D().productos.find(p => p.barras === q || p.cod.toLowerCase() === q.toLowerCase());
  const r = exacto ? [exacto] : buscarProductos(q);
  if (!r.length){ error('No se encontró «' + esc(q) + '»'); return; }
  agregarAlCarro(r[0].id);
  _qPos = ''; $('#pos-buscar').value = ''; pintarResultadosPos();
}

/* ---------- El carro (ticket) ---------- */
function agregarAlCarro(pid, c){
  const p = producto(pid); if (!p) return;
  const paso = pasoDe(p), ya = CARRO.it.find(i => i.p === pid);
  if (ya) ya.c = r2(ya.c + (c || paso));
  else CARRO.it.push({ p:pid, n:p.nombre, c:c || paso, pr:p.precio });
  if (seccionActual === 'vender' && EST_VENDER.tab === 'mostrador'){
    pintarTicket();
    const el = $(`#tk-${pid}`); if (el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    const i = $('#pos-buscar'); if (i && window.innerWidth > 900) i.focus();
  }
}
function cambiarCant(pid, val, delta){
  const it = CARRO.it.find(i => i.p === pid); if (!it) return;
  const paso = pasoDe(producto(pid));
  let c = delta ? r2(it.c + delta * paso) : Number(String(val).replace(',', '.'));
  if (!(c > 0)){ if (delta) c = paso; else return pintarTicket(); }
  it.c = paso >= 1 && producto(pid).unidad !== 'kg' ? Math.round(c) || 1 : r2(c);
  pintarTicket();
}
function quitarDelCarro(pid){ CARRO.it = CARRO.it.filter(i => i.p !== pid); pintarTicket(); }
function vaciarCarro(silencio){ CARRO = { it:[], cli:null, descTipo:'%', descVal:0, pre:null }; if (!silencio && seccionActual === 'vender') pintarTicket(); }
function totalesCarro(){
  const sub = CARRO.it.reduce((s, i) => s + i.c * i.pr, 0);
  let desc = CARRO.descTipo === '%' ? Math.round(sub * (Number(CARRO.descVal) || 0) / 100) : Math.round(Number(CARRO.descVal) || 0);
  desc = Math.max(0, Math.min(desc, sub));
  return { sub, desc, tot:sub - desc, pctDesc: sub ? desc / sub * 100 : 0 };
}
function pintarTicket(){
  const caja = $('#ticket'); if (!caja) return;
  const t = totalesCarro(), c = cliente(CARRO.cli);
  const filas = CARRO.it.map(i => { const p = producto(i.p), disp = disponibleDe(p), pasa = i.c > disp;
    return `<div class="tk-it" id="tk-${i.p}">
      <div class="tk-n"><b>${esc(i.n)}</b><small>${pesos(i.pr)} / ${unidadCorta(p)}${pasa ? ` · <span class="neg">${disp > 0 ? 'hay ' + cant(disp) + ' disponibles' : 'sin disponible'}</span>` : ''}</small></div>
      <div class="tk-cant"><button onclick="cambiarCant('${i.p}',0,-1)" aria-label="Menos">${ico('menos')}</button>
        <input value="${cant(i.c)}" inputmode="decimal" aria-label="Cantidad" onchange="cambiarCant('${i.p}',this.value)" onfocus="this.select()">
        <button onclick="cambiarCant('${i.p}',0,1)" aria-label="Más">${ico('mas')}</button></div>
      <div class="tk-sub num">${pesos(i.c * i.pr)}</div>
      <button class="tk-x" onclick="quitarDelCarro('${i.p}')" aria-label="Quitar">${ico('x')}</button></div>`; }).join('');
  const tope = !esDueno() ? `<small class="muted">Tu tope de descuento: ${D().config.topeDescFunc} %</small>` : '';
  caja.innerHTML = `<div class="tk-cab">
      <div class="tk-t">${CARRO.modo === 'pres' ? 'Nuevo presupuesto' : CARRO.pre ? 'Venta desde presupuesto' : 'Nueva venta'}</div>
      ${CARRO.it.length ? `<button class="link" onclick="vaciarCarro()">Vaciar</button>` : ''}</div>
    <button class="tk-cli" onclick="elegirClienteVenta()">${ico('clientes')}<span><small>Cliente</small><b>${esc(c ? c.nombre : 'Consumidor final')}</b>
      ${c && c.limite ? `<small>Cuenta corriente: saldo ${pesos(saldoCliente(c.id))} de ${pesos(c.limite)}</small>` : ''}</span><span class="link">Cambiar</span></button>
    <div class="tk-items">${filas || `<div class="tk-vacio">${hexagono()}Agregá productos desde la izquierda<br><small>o escaneá el código de barras</small></div>`}</div>
    ${CARRO.it.length ? `<div class="tk-desc"><span>Descuento</span>
      <div class="segmento seg-chico"><button class="${CARRO.descTipo === '%' ? 'on' : ''}" onclick="CARRO.descTipo='%';pintarTicket()">%</button><button class="${CARRO.descTipo === '$' ? 'on' : ''}" onclick="CARRO.descTipo='$';pintarTicket()">$</button></div>
      <input value="${CARRO.descVal || ''}" placeholder="0" inputmode="decimal" aria-label="Descuento" onchange="CARRO.descVal=Number(this.value.replace(',','.'))||0;pintarTicket()">${tope}</div>
    <div class="tk-tot"><div><span>Subtotal</span><span class="num">${pesos(t.sub)}</span></div>
      ${t.desc ? `<div><span>Descuento (${pct(t.pctDesc)})</span><span class="num">− ${pesos(t.desc)}</span></div>` : ''}
      <div class="tk-total"><span>Total</span><span class="num">${pesos(t.tot)}</span></div><small class="muted">Precios con IVA incluido</small></div>
    ${CARRO.modo === 'pres' ? `<button class="btn btn-naranja btn-grande tk-cobrar" onclick="guardarComoPresupuesto()">${ico('presupuesto')} Guardar presupuesto</button>
    <button class="btn btn-linea btn-sm tk-pres" onclick="CARRO.modo='';cobrar()">${ico('vender')} Cobrar como venta</button>`
    : `<button class="btn btn-naranja btn-grande tk-cobrar" onclick="cobrar()">Cobrar ${pesos(t.tot)}</button>
    <button class="btn btn-linea btn-sm tk-pres" onclick="guardarComoPresupuesto()">${ico('presupuesto')} Guardar como presupuesto</button>`}` : ''}`;
  const b = $('#pos-barra');
  if (b) b.innerHTML = CARRO.it.length ? `<span>${CARRO.it.length} producto${CARRO.it.length > 1 ? 's' : ''}<b class="num">${pesos(t.tot)}</b></span>${CARRO.modo === 'pres' ? '<button class="btn btn-naranja" onclick="guardarComoPresupuesto()">Guardar presupuesto</button>' : '<button class="btn btn-naranja" onclick="cobrar()">Cobrar</button>'}` : '';
  if (b) b.classList.toggle('hidden', !CARRO.it.length);
}

/* ---------- Elegir cliente ---------- */
let _volverACobrar = false;
function elegirClienteVenta(){
  _volverACobrar = _ventaAbierta; _ventaAbierta = false;
  const lista = q => { q = sinTildes(q || '');
    const r = D().clientes.filter(c => !q || sinTildes(c.nombre + ' ' + c.doc).includes(q));
    return `<button class="fila-lista" onclick="ponerCliente(null)"><span><span class="p-nombre">Consumidor final</span><span class="p-cod">Sin datos del cliente</span></span></button>` +
      r.map(c => `<button class="fila-lista" onclick="ponerCliente('${c.id}')"><span><span class="p-nombre">${esc(c.nombre)}</span><span class="p-cod">${c.tdoc} ${esc(c.doc)} · ${esc(c.zona)}</span></span>
        ${c.limite ? `<small class="${saldoCliente(c.id) > c.limite ? 'neg' : 'muted'}">Saldo ${pesos(saldoCliente(c.id))}</small>` : ''}</button>`).join(''); };
  abrirModal({ titulo:'Cliente de la venta', sub:'Buscá por nombre, RUT o cédula',
    cuerpo:`<div class="buscar" style="max-width:none">${ico('buscar')}<input id="bc-q" type="search" placeholder="Buscar cliente…" autocomplete="off"></div><div class="lista mt-s" id="bc-lista">${lista('')}</div>`,
    pie:`<button class="btn btn-linea izq" onclick="formCliente(null, id => { ponerCliente(id); })">${ico('mas')} Cliente nuevo</button><button class="btn btn-linea" onclick="cerrarModal()">Cancelar</button>`,
    alAbrir: m => $('#bc-q', m).addEventListener('input', e => $('#bc-lista').innerHTML = lista(e.target.value)) });
}
function ponerCliente(id){
  CARRO.cli = id; cerrarModal();
  if (seccionActual === 'vender' && EST_VENDER.tab === 'mostrador') pintarTicket();
  if (_volverACobrar){ _volverACobrar = false; const c = cliente(id); if (c){ CIERRE.dir = CIERRE.dir || c.dir; CIERRE.zona = c.zona; } _ventaAbierta = true; cobrar(); }
}
let _ventaAbierta = false;

/* ---------- Cerrar la venta ---------- */
let CIERRE = {};
function cobrar(){
  if (!CARRO.it.length) return;
  const t = totalesCarro();
  if (!esDueno() && t.pctDesc > D().config.topeDescFunc + .01){
    error('Tu descuento máximo es ' + D().config.topeDescFunc + ' %. Para más, lo tiene que hacer ' + SOCIOS.join(' o ') + '.'); return;
  }
  const c = cliente(CARRO.cli);
  if (!_ventaAbierta) CIERRE = { vend:'', pago:'', fac:'', facT: c && c.tdoc === 'RUT' ? 'e-Factura' : 'e-Ticket', facN:'', ent:'lleva', dir:c ? c.dir : '', zona:c ? c.zona : D().config.zonas[0], fEnt:hoy(), flete:D().config.fleteBase, nota:'' };
  _ventaAbierta = true;
  const op = (grupo, val, txt, sub) => `<button type="button" class="opcion ${CIERRE[grupo] === val ? 'on' : ''}" onclick="opCierre('${grupo}','${val}')">${txt}${sub ? `<small>${sub}</small>` : ''}</button>`;
  const flete = CIERRE.ent === 'envio' ? Number(CIERRE.flete) || 0 : 0;
  abrirModal({ titulo:'Cerrar la venta', sub:`${CARRO.it.length} producto${CARRO.it.length > 1 ? 's' : ''} · ${esc(c ? c.nombre : 'Consumidor final')}`, ancho:'md', foco:false,
    alCerrar: () => { _ventaAbierta = false; },
    cuerpo:`<div class="cierre">
      <div class="ci-paso"><div class="ci-t"><span>1</span>¿Quién vende?</div><div class="opciones" id="op-vend">${Object.keys(USUARIOS).map(k => op('vend', k, USUARIOS[k].nombre, k === VENDEDOR ? 'Suma a su comisión' : 'No suma comisión')).join('')}</div></div>
      <div class="ci-paso"><div class="ci-t"><span>2</span>Forma de pago</div><div class="opciones" id="op-pago">${FORMAS_PAGO.map(f => op('pago', f, f, f === 'Cuenta corriente' ? (c && c.limite ? 'Saldo ' + pesos(saldoCliente(c.id)) : 'Elegir cliente') : '')).join('')}</div></div>
      <div class="ci-paso"><div class="ci-t"><span>3</span>¿Se facturó?</div><div class="opciones" id="op-fac">${op('fac', 'si', 'Sí, ya está facturada')}${op('fac', 'no', 'No, todavía', 'Queda «Pendiente de factura»')}</div>
        ${CIERRE.fac === 'si' ? `<div class="form mt-s">${campo('Tipo', sel('facT', ['e-Ticket', 'e-Factura'], CIERRE.facT, 'onchange="CIERRE.facT=this.value"'))}${campo('Número', inp('facN', CIERRE.facN, 'text', 'placeholder="Ej.: A 40999" oninput="CIERRE.facN=this.value"'), { req:true })}</div>` : ''}</div>

function opCierre(g, v){ CIERRE[g] = v; const y = $('#modal').scrollTop, y2 = $('#modal-caja').scrollTop; cobrar(); $('#modal').scrollTop = y; $('#modal-caja').scrollTop = y2; }
function totalCierre(){ const el = $('#ci-total'); if (el) el.textContent = pesos(totalesCarro().tot + (CIERRE.ent === 'envio' ? Number(CIERRE.flete) || 0 : 0)); }

async function confirmarVenta(){
  const c = cliente(CARRO.cli), t = totalesCarro();
  const falta = g => { const el = $('#op-' + g); if (el) $$('.opcion', el).forEach(o => { o.classList.remove('falta'); void o.offsetWidth; o.classList.add('falta'); }); };
  if (!CIERRE.vend){ falta('vend'); error('Falta indicar quién vende'); return; }
  if (!CIERRE.pago){ falta('pago'); error('Falta la forma de pago'); return; }
  if (!CIERRE.fac){ falta('fac'); error('Falta indicar si se facturó'); return; }
  if (CIERRE.fac === 'si' && !CIERRE.facN.trim()){ error('Escribí el número de factura (o marcá «No, todavía»)'); return; }
  if ((CIERRE.pago === 'Cuenta corriente' || CIERRE.ent === 'acopio') && !c){ error(CIERRE.pago === 'Cuenta corriente' ? 'La cuenta corriente necesita un cliente' : 'El acopio necesita un cliente'); elegirClienteVenta(); return; }
  if (CIERRE.pago === 'Cuenta corriente' && !(c.limite > 0)){ error(esc(c.nombre) + ' no tiene cuenta corriente habilitada (límite en su ficha)'); return; }
  if (CIERRE.ent === 'envio' && !CIERRE.dir.trim()){ error('Falta la dirección de entrega'); return; }
  const flete = CIERRE.ent === 'envio' ? Number(CIERRE.flete) || 0 : 0, tot = t.tot + flete;
  // Más de lo disponible: pedir confirmación explícita
  const pasan = CARRO.it.filter(i => i.c > disponibleDe(producto(i.p)));
  if (pasan.length){
    const ok = await confirmar('Hay productos sin stock suficiente', `<p>Vas a vender más de lo que hay disponible:</p><ul class="lista-simple">${pasan.map(i => { const p = producto(i.p); return `<li><b>${esc(p.nombre)}</b>: vendés ${cant(i.c)}, hay ${cant(Math.max(0, disponibleDe(p)))} ${unidadCorta(p)}</li>`; }).join('')}</ul><p class="mt-s">El stock va a quedar en negativo hasta que entre mercadería. ¿Confirmás igual?</p>`, 'Sí, vender igual', true);
    if (!ok) return;
  }
  if (CIERRE.pago === 'Cuenta corriente' && saldoCliente(c.id) + tot > c.limite){
    const ok = await confirmar('Supera el límite de crédito', `Con esta venta, <b>${esc(c.nombre)}</b> queda con un saldo de <b>${pesos(saldoCliente(c.id) + tot)}</b> y su límite es de ${pesos(c.limite)}. ¿Confirmás igual?`, 'Sí, confirmar', true);
    if (!ok) return;
  }
  const v = { id:Store.id('v'), num:nuevoNumero('venta'), f:hoy(), h:hora(), vend:CIERRE.vend, u:usuarioTxt(), cli:c ? c.id : null,
    it: CARRO.it.map(i => { const p = producto(i.p); return { p:i.p, n:p.nombre, c:i.c, pr:i.pr, co:p.costo, e:0, d:0 }; }),
    sub:t.sub, desc:t.desc, fl:flete, tot, pago:CIERRE.pago, fac: CIERRE.fac === 'si' ? { t:CIERRE.facT, n:CIERRE.facN.trim() } : null,
    est:'ok', devs:[], ent: CIERRE.ent === 'envio' ? { dir:CIERRE.dir.trim(), zona:CIERRE.zona, f:CIERRE.fEnt || hoy(), flete, nota:CIERRE.nota, est:'pendiente' } : null,
    aco: CIERRE.ent === 'acopio', ret:[], pre:CARRO.pre };
  // En el mismo paso: se lleva ahora → sale del stock; envío o acopio → queda reservado
  if (CIERRE.ent === 'lleva') v.it.forEach(i => { sacarStock(i.p, i.c, 'venta', 'Venta Nº ' + v.num); i.e = i.c; });
  D().ventas.push(v);
  if (CARRO.pre){ const pp = D().presupuestos.find(x => x.id === CARRO.pre); if (pp){ pp.est = 'convertido'; pp.venta = v.id; } }
  registrar(`Registró la venta Nº ${v.num} por ${pesos(tot)} (${v.pago}${v.fac ? '' : ', pendiente de factura'}${v.ent ? ', con envío' : v.aco ? ', acopio' : ''})`);
  guardar();
  _ventaAbierta = false; cerrarModal();
  vaciarCarro(true); _qPos = '';
  pintarNav(); RENDER.vender();
  mostrarVentaHecha(v);
}
function mostrarVentaHecha(v){
  abrirModal({ titulo:'Venta registrada', sub:'Nº ' + v.num + ' · ' + v.h, ancho:'modal-sm', foco:false,
    cuerpo:`<div class="hecha">${ico('ok')}<b class="num">${pesos(v.tot)}</b><span>${v.pago} · ${vendedorTxt(v)}</span>
      ${v.fac ? `<span class="chip c-verde">${esc(v.fac.t)} ${esc(v.fac.n)}</span>` : '<span class="chip chip-fac">Pendiente de factura</span>'}
      <small class="muted">${v.ent ? 'Queda reservado para la entrega del ' + fMedia(v.ent.f) + '.' : v.aco ? 'Queda en acopio a nombre de ' + esc(nombreCli(v.cli)) + '.' : 'El stock ya se descontó.'}</small></div>`,
    pie:`<button class="btn btn-linea" onclick="cerrarModal(); fichaVenta('${v.id}')">Ver la venta</button><button class="btn btn-naranja" onclick="cerrarModal(); nuevaVenta()">${ico('mas')} Otra venta</button>` });

/* ===== js/09-ventas.js ===== */
/* =====================================================================
   VENTAS · lista con filtros, ficha, factura, devolución y anulación
   ===================================================================== */
const EST_VENTAS = { periodo:'mes', estado:'todas', vend:'', pago:'', q:'', ver:60 };
const PERIODOS = [['hoy', 'Hoy'], ['7', 'Últimos 7 días'], ['mes', 'Este mes'], ['mesant', 'Mes pasado'], ['todo', 'Todo']];
function rangoPeriodo(p){
  const h = hoy();
  if (p === 'hoy') return [h, h];
  if (p === '7') return [sumarDias(h, -6), h];
  if (p === 'mes') return [inicioMes(h), h];
  if (p === 'mesant'){ const i = sumarMeses(inicioMes(h), -1); return [i, finMes(i)]; }
  return ['0000-00-00', '9999-12-31'];
}
function verVentas(filtro){
  EST_VENDER.tab = 'ventas'; EST_VENTAS.ver = 60;
  if (filtro === 'hoy'){ EST_VENTAS.periodo = 'hoy'; EST_VENTAS.estado = 'todas'; }
  if (filtro === 'pendiente'){ EST_VENTAS.periodo = 'todo'; EST_VENTAS.estado = 'pendiente'; }
  if (filtro === 'mias'){ EST_VENTAS.periodo = 'todo'; EST_VENTAS.estado = 'pendiente'; EST_VENTAS.vend = PERFIL; }
  if (seccionActual !== 'vender') ir('vender'); else RENDER.vender();
}
function ventasFiltradas(){
  const e = EST_VENTAS, [a, b] = rangoPeriodo(e.periodo), q = sinTildes(e.q);
  return D().ventas.filter(v => v.f >= a && v.f <= b
    && (e.estado === 'todas' || (e.estado === 'facturada' && ventaActiva(v) && v.fac) || (e.estado === 'pendiente' && pendienteFactura(v))
        || (e.estado === 'anulada' && !ventaActiva(v)) || (e.estado === 'devolucion' && v.devs.length))
    && (!e.vend || v.vend === e.vend) && (!e.pago || v.pago === e.pago)
    && (!q || sinTildes(nombreCli(v.cli) + ' ' + v.num + ' ' + (v.fac ? v.fac.n : '') + ' ' + v.it.map(i => i.n).join(' ')).includes(q)))
    .sort((x, y) => (y.f + y.h).localeCompare(x.f + x.h));
}
let _masFiltrosV = false;
function pintarListaVentas(){
  const e = EST_VENTAS, lista = ventasFiltradas();

      <button class="link" onclick="_masFiltrosV=!_masFiltrosV;pintarListaVentas()">${_masFiltrosV || hayFiltros ? 'Menos filtros' : 'Más filtros'}</button>
    </div>
    ${_masFiltrosV || hayFiltros ? `<div class="herr">
      <select class="sel" onchange="EST_VENTAS.vend=this.value;pintarListaVentas()" aria-label="Vendedor">${opc([['', 'Todos los vendedores']].concat(Object.keys(USUARIOS).map(k => [k, USUARIOS[k].nombre])), e.vend)}</select>
      <select class="sel" onchange="EST_VENTAS.pago=this.value;pintarListaVentas()" aria-label="Forma de pago">${opc([['', 'Todas las formas de pago']].concat(FORMAS_PAGO.map(f => [f, f])), e.pago)}</select>

    <div class="herr">${pildoras([['todas', 'Todas'], ['pendiente', 'Sin factura', pend.length, 'p-amarillo'], ['anulada', 'Anuladas']], e.estado, 'filtroVentasEstado')}

function filtroVentasEstado(v){ EST_VENTAS.estado = v; EST_VENTAS.ver = 60; pintarListaVentas(); }
function exportarVentas(){
  exportarCSV('Ventas', ['Nº', 'Fecha', 'Hora', 'Cliente', 'Vendedor', 'Forma de pago', 'Factura', 'Estado', 'Subtotal', 'Descuento', 'Flete', 'Total', 'Devuelto', 'Neto'],
    ventasFiltradas().map(v => [v.num, fCorta(v.f), v.h, nombreCli(v.cli), vendedorTxt(v), v.pago, v.fac ? v.fac.t + ' ' + v.fac.n : 'Pendiente de factura',
      ventaActiva(v) ? 'Vigente' : 'Anulada', numCSV(v.sub), numCSV(v.desc), numCSV(v.fl), numCSV(v.tot), numCSV(montoDevuelto(v)), numCSV(netoVenta(v))]));
}

/* ---------- Ficha de la venta ---------- */
function fichaVenta(id){
  const v = venta(id); if (!v) return;
  const f = factorDesc(v), activa = ventaActiva(v), dueno = esDueno();
  const filas = v.it.map(i => { const p = producto(i.p), pend = r2(i.c - i.e);
    return `<tr><td><span class="p-nombre">${esc(i.n)}</span><span class="p-cod">${p ? p.cod : ''}${pend > 0 && activa ? ` · <b class="am">${cant(pend)} sin entregar</b>` : ''}${i.d ? ` · <b class="neg">${cant(i.d)} devuelto</b>` : ''}</span></td>
      <td class="derecha num">${cant(i.c)} ${p ? unidadCorta(p) : ''}</td><td class="derecha num">${pesos(i.pr)}</td><td class="derecha num">${pesos(i.c * i.pr)}</td></tr>`; }).join('');
  const lineas = [['Subtotal', pesos(v.sub)]];
  if (v.desc) lineas.push(['Descuento (' + pct(v.desc / v.sub * 100) + ')', '− ' + pesos(v.desc)]);
  if (v.fl) lineas.push(['Flete', pesos(v.fl)]);
  lineas.push(['<b>Total</b>', '<b>' + pesos(v.tot) + '</b>']);
  if (v.devs.length) lineas.push(['Devuelto', '− ' + pesos(montoDevuelto(v))], ['<b>Neto</b>', '<b>' + pesos(netoVenta(v)) + '</b>']);
  const com = esDeLucas(v) && activa ? comisionVenta(v) : null;
  abrirModal({ titulo:'Venta Nº ' + v.num, sub:`${fLarga(v.f)} · ${v.h} · registrada por ${esc(v.u)}`, ancho:'md', foco:false,
    cuerpo:`<div class="fila">${chipsVenta(v)}</div>
      <div class="datos mt-s">
        <div><small>Cliente</small><b>${v.cli ? `<a class="link" onclick="fichaCliente('${v.cli}')">${esc(nombreCli(v.cli))}</a>` : 'Consumidor final'}</b></div>
        <div><small>Vendió</small><b>${vendedorTxt(v)}</b></div>
        <div><small>Forma de pago</small><b>${v.pago}${v.pago === 'Cuenta corriente' ? (ventaCobrada(v) ? ' · cobrada' : ' · sin cobrar') : ''}</b></div>
        <div><small>Factura</small><b>${v.fac ? esc(v.fac.t + ' ' + v.fac.n) : '<span class="am">Pendiente</span>'}</b></div>
        ${com && dueno ? `<div><small>Comisión de ${esc(USUARIOS[VENDEDOR].nombre)}</small><b>Suma ${pesos2(com.base)} (sin IVA) al total del mes de ${esc(USUARIOS[VENDEDOR].nombre)}${ventasLiquidadas().has(v.id) ? ' · liquidada' : ventaCobrada(v) ? '' : ' · cuando se cobre'}</b></div>` : ''}
      </div>
      <div class="tabla-caja mt-s"><table class="tabla"><thead><tr><th>Producto</th><th class="derecha">Cant.</th><th class="derecha">Precio</th><th class="derecha">Importe</th></tr></thead>
        <tbody>${filas}</tbody><tfoot>${lineas.map(([a, b]) => `<tr><td colspan="3" class="derecha">${a}</td><td class="derecha num">${b}</td></tr>`).join('')}</tfoot></table></div>
      ${v.ent ? `<div class="caja-info mt-s">${ico('camion')}<span><b>Entrega ${ESTADOS_ENTREGA[v.ent.est].t.toLowerCase()}</b> · ${fLarga(v.ent.f)} · ${esc(v.ent.dir)} (${esc(v.ent.zona)})${v.ent.nota ? ' · ' + esc(v.ent.nota) : ''}
        <br><a class="link" onclick="fichaEntrega('${v.id}')">Ver la entrega</a></span></div>` : ''}
      ${v.aco ? `<div class="caja-info mt-s">${ico('acopio')}<span><b>Acopio:</b> ${v.ret.length} retiro${v.ret.length === 1 ? '' : 's'}. Pendiente de retirar: <b>${pesos(pendienteAcopio(v))}</b></span></div>` : ''}
      ${v.devs.map(d => `<div class="caja-info aviso-am mt-s">${ico('volver')}<span><b>Devolución del ${fMedia(d.f)}</b> por ${pesos(d.monto)} · ${d.it.map(x => cant(x.c) + ' × ' + esc((producto(x.p) || {}).nombre)).join(', ')} · Motivo: ${esc(d.m)} · ${esc(d.u)}</span></div>`).join('')}
      ${v.anul ? `<div class="caja-info alerta mt-s">${ico('anular')}<span><b>Anulada el ${fMedia(v.anul.f)}</b> por ${esc(v.anul.u)}. Motivo: ${esc(v.anul.m)}. El stock volvió.</span></div>` : ''}`,

/* ---------- Devolución: la mercadería vuelve al stock y se descuenta de la base de la comisión ---------- */
function formDevolucion(id){

      ${campo('Se le devuelve', `<div class="dev-total num" id="dev-total">$ 0</div>`, { ayuda: v.pago === 'Cuenta corriente' ? 'Se descuenta de su cuenta corriente' : 'Por ' + v.pago.toLowerCase() })}</div>
      ${esDeLucas(v) && ventasLiquidadas().has(v.id) ? `<div class="caja-info aviso-am mt-s">${ico('info')}<span>Esta venta ya estaba en una liquidación de comisiones: lo devuelto (sin IVA) se descuenta de la base de la próxima.</span></div>` : ''}`,
    pie:`<button class="btn btn-linea" onclick="fichaVenta('${id}')">Volver</button><button class="btn btn-azul" onclick="guardarDevolucion('${id}')">${ico('volver')} Confirmar devolución</button>` });
}
function leerDevolucion(v){
  const f = factorDesc(v), it = []; let monto = 0;
  v.it.forEach(i => { const el = $(`[name="dv_${i.p}"]`); if (!el) return; const q = Math.min(Number(el.value) || 0, r2(i.e - i.d)); if (q > 0){ it.push({ p:i.p, c:r2(q) }); monto += q * i.pr * f; } });
  return { it, monto:Math.round(monto) };
}
function totalDevolucion(id){ $('#dev-total').textContent = pesos(leerDevolucion(venta(id)).monto); }
function guardarDevolucion(id){
  const v = venta(id), { it, monto } = leerDevolucion(v), motivo = $('[name="motivo"]').value;
  if (!it.length){ error('Indicá la cantidad que devuelve'); return; }
  const baseAntes = comisionVenta(v).base;
  it.forEach(x => { const i = v.it.find(y => y.p === x.p); i.d = r2(i.d + x.c); entrarStock(x.p, x.c, 'devolucion', 'Devolución · venta Nº ' + v.num); });
  v.devs.push({ f:hoy(), it, monto, m:motivo, u:usuarioTxt() });
  ajusteComision(v, baseAntes, 'Devolución venta Nº ' + v.num);
  registrar(`Registró una devolución de ${pesos(monto)} en la venta Nº ${v.num} (${motivo})`);
  guardar(); avisar('Devolución registrada: la mercadería volvió al stock', 'volver'); fichaVenta(id); refrescar();
}

/* ---------- Anular (solo dueños) ---------- */
function anularVenta(id){
  if (!esDueno()) return;
  const v = venta(id);
  abrirModal({ titulo:'Anular la venta Nº ' + v.num, sub:pesos(netoVenta(v)) + ' · ' + esc(nombreCli(v.cli)), ancho:'modal-sm',
    cuerpo:`<div class="caja-info alerta">${ico('alerta')}<span>La venta queda anulada (no se borra) y <b>el stock vuelve</b>. Queda registrado quién la anuló y por qué.</span></div>
      <div class="form mt">${campo('Motivo', inp('m', '', 'text', 'placeholder="Ej.: error en la carga"'), { ancho:true, req:true })}</div>`,
    pie:`<button class="btn btn-linea" onclick="fichaVenta('${id}')">Volver</button><button class="btn btn-peligro" onclick="confirmarAnulacion('${id}')">${ico('anular')} Anular venta</button>` });
}
function confirmarAnulacion(id){
  const v = venta(id), m = $('[name="m"]').value.trim();
  if (!m){ error('El motivo es obligatorio'); return; }
  const baseAntes = comisionVenta(v).base;
  v.it.forEach(i => { const q = r2(i.e - i.d); if (q > 0) entrarStock(i.p, q, 'anulacion', 'Anulación · venta Nº ' + v.num); });
  v.est = 'anulada'; v.anul = { f:hoy(), m, u:usuarioTxt() };
  ajusteComision(v, baseAntes, 'Anulación venta Nº ' + v.num);
  if (v.pre){ const pp = D().presupuestos.find(x => x.id === v.pre); if (pp){ pp.est = 'abierto'; pp.venta = null; } }
  registrar(`Anuló la venta Nº ${v.num} por ${pesos(v.tot)}. Motivo: ${m}`);
  guardar(); avisar('Venta Nº ' + v.num + ' anulada. El stock volvió.', 'anular'); fichaVenta(id); refrescar();
}

/* ---------- Acopios ---------- */
function pendienteAcopio(v){ const f = factorDesc(v); return v.it.reduce((s, i) => s + Math.max(0, i.c - i.e) * i.pr * f, 0); }
function pintarAcopios(){
  const lista = D().ventas.filter(v => v.aco && ventaActiva(v)).sort((a, b) => pendienteEntrega(b) - pendienteEntrega(a) || b.f.localeCompare(a.f));

    <div class="grid g-2 mt">${lista.map(v => { const pend = pendienteAcopio(v), f = factorDesc(v);
      return `<div class="card">
        <div class="card-cab"><div class="card-t">${esc(nombreCli(v.cli))}<small>Venta Nº ${v.num} · ${fMedia(v.f)} · pagó ${pesos(v.tot)}</small></div>
          ${pend > 0 ? `<span class="chip c-amarillo">Falta retirar ${pesos(pend)}</span>` : '<span class="chip c-verde">Retirado todo</span>'}</div>

          return `<div class="aco-it"><div class="fila-fin"><span>${esc(i.n)}</span><span class="num t2">${cant(i.e)} de ${cant(i.c)} ${unidadCorta(p)}</span></div>
            <div class="avance"><span style="width:${por}%"></span></div></div>`; }).join('')}
        <div class="fila-fin mt-s"><small class="muted">${v.ret.length} retiro${v.ret.length === 1 ? '' : 's'}${v.ret.length ? ' · último ' + fMedia(v.ret[v.ret.length - 1].f) : ''}</small>
          ${pend > 0 ? `<button class="btn btn-azul btn-sm" onclick="formRetiro('${v.id}')">${ico('acopio')} Registrar retiro</button>` : ''}</div></div>`; }).join('')}</div>

function formRetiro(id){

function guardarRetiro(id){

  if (!it.length){ error('Indicá cuánto retira'); return; }
  it.forEach(x => { const i = v.it.find(y => y.p === x.p); i.e = r2(i.e + x.c); sacarStock(x.p, x.c, 'retiro', 'Retiro de acopio · venta Nº ' + v.num); });

}

/* =====================================================================
   STOCK · productos, ficha (lotes + historial) y alta / edición
   Lucas (vendedor) consulta todo, pero NO ve costos ni márgenes.
   ===================================================================== */
const EST_STOCK = { tab:'productos', filtro:'todos', q:'', cat:'', prov:'', ver:80 };
const GRUPO_FILTRO = { falta:'reponer', bajo:'reponer', proximo:'vence', vencido:'vence' };
function verStock(filtro){
  EST_STOCK.ver = 80;
  if (filtro === 'alertas') EST_STOCK.tab = 'alertas';
  else { EST_STOCK.tab = 'productos'; EST_STOCK.filtro = GRUPO_FILTRO[filtro] || filtro || 'todos'; EST_STOCK.q = ''; }
  if (seccionActual !== 'stock') ir('stock'); else RENDER.stock();
}
RENDER.stock = function(){
  const t = EST_STOCK.tab, dueno = esDueno();
  const nAl = alertas().filter(a => a.sec === 'stock').length;
  encabezado('Stock', 'Se actualiza solo con cada venta, compra y devolución.',
    menuMas([
      dueno && ['ajuste', 'Ajustar stock (rotura, pérdida…)', 'formAjuste()'],
      dueno && ['porcentaje', 'Actualizar precios en bloque', 'formPreciosMasivo()'],
      dueno && ['lista', 'Hacer inventario físico', "tabStock('inventario')"],
      ['historial', 'Ver todos los movimientos', "tabStock('movimientos')"],

    ]) + (dueno ? `<button class="btn btn-azul" onclick="formProducto()">${ico('mas')} Nuevo producto</button>` : ''));

  $('#vista').innerHTML = pestanas(tabs, t, 'tabStock') + '<div id="stock-cuerpo"></div>';
  ({ productos:pintarProductos, alertas:pintarAlertasStock, lista:pintarListaCompra, movimientos:pintarMovimientos, inventario:pintarInventario })[t]();
};
function tabStock(t){ EST_STOCK.tab = t; EST_STOCK.ver = 80; RENDER.stock(); }

/* ---------- Lista de productos (pocas columnas: el detalle está en la ficha) ---------- */
function cumpleFiltro(i, f){
  if (f === 'todos') return true;
  if (f === 'reponer') return i.estados.includes('falta') || i.estados.includes('bajo');
  if (f === 'vence') return i.estados.includes('proximo') || i.estados.includes('vencido');
  return i.estados.includes(f);
}
function productosFiltrados(){
  const e = EST_STOCK, q = sinTildes(e.q).split(/s+/).filter(Boolean);
  return D().productos.filter(p => {
    if (!cumpleFiltro(info(p), e.filtro)) return false;
    if (e.cat && p.cat !== e.cat) return false;
    const t = sinTildes(p.nombre + ' ' + p.cod + ' ' + p.marca + ' ' + p.barras);
    return q.every(w => t.includes(w));
  }).sort((a, b) => a.nombre.localeCompare(b.nombre));
}
function chipSimple(p){
  const e = info(p).estado;
  return e === 'normal' ? '' : chipEstadoProd(e);
}
function pintarProductos(){
  const e = EST_STOCK, lista = productosFiltrados();
  const cnt = f => D().productos.filter(p => cumpleFiltro(info(p), f)).length;
  const { filas, mas } = paginar(lista, e, 'EST_STOCK.ver+=100;pintarProductos()');
  $('#stock-cuerpo').innerHTML = `
    <div class="herr">
      ${buscador('s-q', e.q, 'Buscar producto por nombre o código', 'filtroStockQ')}
      <select class="sel" onchange="EST_STOCK.cat=this.value;pintarProductos()" aria-label="Categoría"><option value="">Todas las categorías</option>${D().config.categorias.map(c => `<option ${c === e.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    </div>
    <div class="herr">${pildoras([['todos', 'Todos'], ['reponer', 'Para reponer', cnt('reponer'), 'p-rojo'], ['vence', 'Por vencer', cnt('vence'), 'p-amarillo'], ['sinmov', 'No se venden', cnt('sinmov')]], e.filtro, 'filtroStock')}</div>
    <div class="tabla-caja"><div class="tabla-scroll"><table class="tabla tabla-simple">
      <thead><tr><th>Producto</th><th class="derecha">Hay</th><th class="derecha">Precio</th><th></th></tr></thead>
      <tbody>${filas.map(p => { const i = info(p);
        return `<tr class="clic" onclick="fichaProducto('${p.id}')"><td><span class="p-nombre">${esc(p.nombre)}</span><span class="p-cod">${p.cod}</span></td>
          <td class="derecha num fuerte ${i.disp <= 0 ? 'neg' : i.disp <= p.min ? 'am' : ''}">${cant(i.disp)} <span class="muted">${unidadCorta(p)}</span></td>
          <td class="derecha num">${pesos(p.precio)}</td><td class="derecha">${chipSimple(p)}</td></tr>`; }).join('')}</tbody></table></div>
      ${lista.length ? '' : vacio('No hay productos con estos filtros.')}${mas}</div>
    <p class="muted chico mt-s">Tocá un producto para ver todo: stock, reservado, lotes, costos e historial.</p>`;
}
let _tSQ;
function filtroStockQ(v){ EST_STOCK.q = v; EST_STOCK.ver = 80; clearTimeout(_tSQ); _tSQ = setTimeout(() => { pintarProductos(); const i = $('#s-q'); i.focus(); i.setSelectionRange(v.length, v.length); }, 200); }
function filtroStock(v){ EST_STOCK.filtro = v; EST_STOCK.ver = 80; pintarProductos(); }
function exportarProductos(){
  const dueno = esDueno();
  const cab = ['Código', 'Código de barras', 'Producto', 'Categoría', 'Marca', 'Proveedor', 'Unidad', 'Stock', 'Reservado', 'Disponible', 'Mínimo', 'Precio'].concat(dueno ? ['Costo', 'Margen %'] : []).concat(['Estado']);
  exportarCSV('Stock', cab, productosFiltrados().map(p => { const i = info(p);
    return [p.cod, p.barras, p.nombre, p.cat, p.marca, nombreProv(p.prov), UNIDADES[p.unidad].t, numCSV(i.st), numCSV(i.res), numCSV(i.disp), numCSV(p.min), p.precio]
      .concat(dueno ? [p.costo, numCSV(margenDe(p))] : []).concat([i.estados.map(e => ESTADOS_PROD[e].t).join(', ') || 'Normal']); }));
}

/* ---------- Ficha del producto ---------- */
function fichaProducto(id){
  const p = producto(id); if (!p) return;
  const i = info(p), u = unidadCorta(p), dueno = esDueno(), h = hoy();
  const movs = D().mstock.filter(m => m.p === id).slice(0, 40);
  const lotes = p.vence ? lotesOrdenados(p).map(l => { const d = l.vence ? difDias(h, l.vence) : null;
    const chip = d == null ? '<span class="chip c-gris">Sin fecha</span>' : d < 0 ? '<span class="chip c-rojo">Vencido</span>' : d <= 30 ? `<span class="chip c-rojo">Vence ${cuando(l.vence)}</span>` : d <= D().config.diasVence ? `<span class="chip c-amarillo">Vence ${cuando(l.vence)}</span>` : '<span class="chip c-verde">Vigente</span>';
    return `<tr><td class="fuerte">${esc(l.lote)}</td><td class="derecha num">${cant(l.c)} ${u}</td><td>${l.vence ? fCorta(l.vence) : '—'}</td><td>${chip}</td></tr>`; }).join('') : '';

        ${dueno ? `<div><small>Costo</small><b>${pesos(p.costo)}</b></div><div><small>Margen</small><b>${pct(margenDe(p))}</b></div>` : ''}
        <div><small>Proveedor</small><b><a class="link" onclick="fichaProveedor('${p.prov}')">${esc(nombreProv(p.prov))}</a></b></div>
        <div><small>Unidad</small><b>${UNIDADES[p.unidad].t}</b></div>

      <details class="mt"><summary class="sub-t link">Ver historial de movimientos (${movs.length})</summary>

function nuevaVentaSinPreguntar(){ EST_VENDER.tab = 'mostrador'; CARRO.modo = CARRO.modo || ''; if (seccionActual !== 'vender') ir('vender'); else RENDER.vender(); }
function filaMov(m){
  const cls = m.c > 0 ? 'pos' : 'neg';
  return `<tr><td class="num">${fMedia(m.f)} <span class="muted">${m.h}</span></td><td><span class="chip sin-punto ${m.c > 0 ? 'c-verde' : 'c-gris'}">${MOTIVOS_MOV[m.m] || m.m}</span></td>
    <td class="t2">${esc(m.ref)}${m.lote ? ` <span class="muted">· lote ${esc(m.lote)}</span>` : ''}</td><td class="derecha num fuerte ${cls}">${m.c > 0 ? '+' : '−'}${cant(Math.abs(m.c))}</td><td class="t2">${esc(m.u)}</td></tr>`;
}

/* ---------- Alta / edición de producto (solo dueños) ---------- */
function formProducto(id){
  if (!esDueno()) return;
  const p = id ? producto(id) : { cod:'', barras:'', nombre:'', cat:D().config.categorias[0], marca:'', prov:D().proveedores[0].id, unidad:'unidad', costo:'', precio:'', min:'', vence:false };
  abrirModal({ titulo: id ? 'Editar producto' : 'Nuevo producto', sub: id ? p.cod : 'Los campos con * son obligatorios', ancho:'md',
    cuerpo:`<div class="form">
      ${campo('Nombre', inp('nombre', p.nombre), { ancho:true, req:true })}
      ${campo('Código', inp('cod', p.cod || siguienteCodigo(p.cat)), { req:true })}
      ${campo('Código de barras', inp('barras', p.barras, 'text', 'inputmode="numeric" placeholder="Escanealo acá"'))}
      ${campo('Categoría', sel('cat', D().config.categorias, p.cat))}
      ${campo('Marca', inp('marca', p.marca))}
      ${campo('Proveedor', sel('prov', D().proveedores.map(x => [x.id, x.nombre]), p.prov))}
      ${campo('Unidad de medida', sel('unidad', Object.keys(UNIDADES).map(k => [k, UNIDADES[k].t]), p.unidad))}
      <div class="form-sep">Precio</div>
      ${campo('Costo (IVA inc.)', inp('costo', p.costo, 'number', 'oninput="calcMargen()"'), { req:true })}
      ${campo('Precio de venta (IVA inc.)', inp('precio', p.precio, 'number', 'oninput="calcMargen()"'), { req:true })}
      ${campo('Margen', inp('margen', p.costo && p.precio ? Math.round(margenDe(p) * 10) / 10 : '', 'number', 'oninput="calcPrecio()"'), { ayuda:'Si lo cambiás, se calcula el precio' })}
      ${campo('Stock mínimo', inp('min', p.min, 'number'), { req:true })}
      ${check('vence', p.vence, 'Maneja vencimiento (por lote)', id ? 'disabled' : 'onchange="$(\'#f-lote\').classList.toggle(\'hidden\',!this.checked)"')}
      ${id ? '' : `<div class="form-sep">Stock inicial</div>
        ${campo('Cantidad que hay hoy', inp('stock', 0, 'number'))}
        <div id="f-lote" class="hidden ancho"><div class="form">${campo('Lote', inp('lote', ''))}${campo('Vence', inp('venceF', '', 'date'))}</div></div>`}
    </div>`,
    pie:`<button class="btn btn-linea" onclick="${id ? `fichaProducto('${id}')` : 'cerrarModal()'}">Volver</button><button class="btn btn-azul" onclick="guardarProducto(${id ? `'${id}'` : ''})">${ico('ok')} Guardar</button>` });
}
function calcMargen(){ const c = Number($('[name=costo]').value), p = Number($('[name=precio]').value); if (c > 0 && p > 0) $('[name=margen]').value = Math.round((p - c) / p * 1000) / 10; }
function calcPrecio(){ const c = Number($('[name=costo]').value), m = Number($('[name=margen]').value); if (c > 0 && m < 100) $('[name=precio]').value = Math.round(c / (1 - m / 100)); }
function siguienteCodigo(cat){ const pre = (cat || 'X')[0].toUpperCase(); const n = D().productos.filter(p => p.cod[0] === pre).map(p => Number(p.cod.slice(1)) || 0); return pre + p2(Math.max(0, ...n) + 1).padStart(3, '0'); }
function guardarProducto(id){
  const o = leerForm($('#modal-cuerpo'));
  if (!o.nombre || !o.cod || !(o.precio > 0) || !(o.costo > 0) || o.min === ''){ error('Completá nombre, código, costo, precio y mínimo'); return; }
  if (D().productos.some(p => p.id !== id && (p.cod.toLowerCase() === o.cod.toLowerCase() || (o.barras && p.barras === o.barras)))){ error('Ya hay otro producto con ese código o código de barras'); return; }
  let p = id && producto(id);
  const datos = { cod:o.cod, barras:o.barras, nombre:o.nombre, cat:o.cat, marca:o.marca || '—', prov:o.prov, unidad:o.unidad, costo:Number(o.costo), precio:Number(o.precio), min:Number(o.min) || 0 };
  if (p){
    const cambios = []; if (p.precio !== datos.precio) cambios.push('precio ' + pesos(p.precio) + ' → ' + pesos(datos.precio)); if (p.costo !== datos.costo) cambios.push('costo ' + pesos(p.costo) + ' → ' + pesos(datos.costo));
    Object.assign(p, datos);
    registrar(`Editó el producto ${p.cod} · ${p.nombre}${cambios.length ? ' (' + cambios.join(', ') + ')' : ''}`);
  } else {
    p = Object.assign({ id:Store.id('pr'), vence:!!o.vence, stock:0, lotes:[], alta:hoy() }, datos);
    D().productos.push(p); _cache = {};
    if (Number(o.stock) > 0) entrarStock(p.id, Number(o.stock), 'ajuste', 'Stock inicial al crear el producto', o.vence ? (o.lote || 'S/L') : '', o.venceF || '');
    registrar(`Creó el producto ${p.cod} · ${p.nombre}`);
  }
  guardar(); avisar('Producto guardado'); fichaProducto(p.id); refrescar();
}

/* ---------- Alertas ---------- */
function pintarAlertasStock(){
  const dueno = esDueno(), h = hoy(), cfg = D().config;
  const P = D().productos.map(p => [p, info(p)]);
  const falta = P.filter(([p, i]) => i.estados.includes('falta')), bajo = P.filter(([p, i]) => i.estados.includes('bajo'));
